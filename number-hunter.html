<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>صائد الأعداد</title>

<style>

/* =========================================================
   NUMBER HUNTER
   FINAL VERSION — 2026-09-17
========================================================= */

:root{
  --blue:#2864c7;
  --blue2:#3975dc;
  --purple:#8552df;
  --purple2:#9b5bea;
  --gold:#f2ae18;
  --green:#21a66f;
  --red:#e5484d;

  --bg:#f3f7ff;
  --card:#ffffff;
  --text:#173b68;
  --muted:#71809a;
  --border:#dce5f2;

  --shadow:0 12px 35px rgba(40,100,199,.12);
}

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  min-height:100%;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(40,100,199,.08),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 75%,
      rgba(133,82,223,.07),
      transparent 30%
    ),
    var(--bg);

  color:var(--text);
}

body{
  overflow:hidden;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  height:100dvh;
  min-height:100dvh;
}

/* =========================================================
   LANGUAGE
========================================================= */

.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;

  padding:
    max(12px,env(safe-area-inset-top))
    18px
    10px;

  position:relative;
  z-index:20;
}

.lang-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);

  width:52px;
  height:44px;

  border-radius:15px;

  font-size:20px;
  font-weight:800;

  box-shadow:var(--shadow);

  cursor:pointer;
  touch-action:manipulation;
}

.lang-btn:active{
  transform:scale(.96);
}

.lang-btn.active{
  background:var(--blue);
  color:#fff;
}

/* =========================================================
   HOME
========================================================= */

#home{
  width:100%;
  height:100dvh;
  min-height:100dvh;

  padding:
    8px
    18px
    calc(45px + env(safe-area-inset-bottom));

  overflow-y:auto;
  overflow-x:hidden;

  overscroll-behavior-y:contain;

  -webkit-overflow-scrolling:touch;
}

.hero{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(133,82,223,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 0% 100%,
      rgba(40,100,199,.10),
      transparent 30%
    ),
    #fff;

  border:1px solid var(--border);
  border-radius:40px;

  padding:42px 20px 34px;

  text-align:center;

  box-shadow:var(--shadow);
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;

  border-radius:50%;

  pointer-events:none;
}

.hero::before{
  width:220px;
  height:220px;

  right:-120px;
  top:-120px;

  background:rgba(133,82,223,.08);
}

.hero::after{
  width:230px;
  height:230px;

  left:-140px;
  bottom:-150px;

  background:rgba(40,100,199,.08);
}

/* =========================================================
   HOME LOGO ONLY
========================================================= */

.logo{
  width:128px;
  height:128px;

  margin:0 auto 28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:35px;

  background:
    linear-gradient(
      145deg,
      var(--blue2),
      var(--blue)
    );

  color:#fff;

  font-size:47px;
  font-weight:900;

  box-shadow:
    0 18px 40px rgba(40,100,199,.28);

  position:relative;
  z-index:2;
}

.game-title{
  margin:0;

  color:var(--blue);

  font-size:
    clamp(42px,11vw,70px);

  line-height:.98;

  font-weight:950;

  letter-spacing:-2px;

  position:relative;
  z-index:2;
}

.game-subtitle{
  margin:26px 0 0;

  color:var(--muted);

  font-size:22px;
  font-weight:700;

  position:relative;
  z-index:2;
}

.prime-row{
  margin-top:38px;

  color:var(--purple);

  font-size:25px;
  font-weight:900;

  direction:ltr;

  position:relative;
  z-index:2;
}

/* =========================================================
   HOME STATS
========================================================= */

.home-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);

  gap:12px;

  margin:20px 0;
}

.stat-card{
  background:#fff;

  border:1px solid var(--border);
  border-radius:28px;

  padding:18px 8px;

  text-align:center;

  box-shadow:var(--shadow);
}

.stat-value{
  font-size:38px;
  font-weight:950;

  color:var(--blue);

  line-height:1;
}

.stat-label{
  margin-top:10px;

  color:var(--muted);

  font-size:16px;
  font-weight:750;
}

/* =========================================================
   HOME BUTTONS
========================================================= */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:14px;
}

.menu-btn{
  min-height:185px;

  border:0;
  border-radius:34px;

  padding:20px;

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;

  text-align:center;

  font-family:inherit;

  cursor:pointer;
  touch-action:manipulation;

  box-shadow:var(--shadow);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.menu-btn:active{
  transform:scale(.97);
}

.menu-icon{
  font-size:47px;
  margin-bottom:10px;
}

.menu-title{
  font-size:26px;
  font-weight:900;
}

.menu-desc{
  margin-top:8px;

  font-size:15px;
  font-weight:650;

  opacity:.9;
}

.blue-btn{
  background:
    linear-gradient(
      145deg,
      #3678df,
      #2864c7
    );

  color:#fff;
}

.purple-btn{
  background:
    linear-gradient(
      145deg,
      #9655e8,
      #7b43d4
    );

  color:#fff;
}

.gold-btn{
  background:
    linear-gradient(
      145deg,
      #f4b321,
      #df9910
    );

  color:#fff;
}

.dark-btn{
  background:
    linear-gradient(
      145deg,
      #315f96,
      #234d82
    );

  color:#fff;
}

.white-btn{
  background:#fff;
  color:var(--text);

  border:1px solid var(--border);
}

.home-extra{
  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:14px;

  margin-top:14px;
}

.small-menu{
  min-height:105px;

  border:1px solid var(--border);
  border-radius:28px;

  background:#fff;
  color:var(--text);

  font-family:inherit;

  font-size:21px;
  font-weight:850;

  cursor:pointer;
  touch-action:manipulation;

  box-shadow:var(--shadow);
}

.small-menu:active{
  transform:scale(.98);
}

.home-footer-space{
  height:55px;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{
  width:100%;
  height:100dvh;
  min-height:0;

  display:flex;
  flex-direction:column;

  padding:
    max(8px,env(safe-area-inset-top))
    12px
    calc(42px + env(safe-area-inset-bottom));

  overflow:hidden;
}

/* =========================================================
   GAME LAYOUT
========================================================= */

.game-layout{
  width:100%;
  height:100%;

  flex:1 1 auto;
  min-height:0;

  display:flex;
  flex-direction:column;
}

/* =========================================================
   GAME HEADER
========================================================= */

.game-stats{
  display:grid;

  grid-template-columns:
    1fr
    1.25fr
    1fr;

  gap:8px;

  flex:0 0 auto;
}

.game-stat{
  min-height:92px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:26px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  text-align:center;

  box-shadow:var(--shadow);
}

.game-stat-value{
  font-size:36px;
  font-weight:950;

  color:var(--blue);

  line-height:1;
}

.game-stat-label{
  margin-top:7px;

  color:var(--muted);

  font-size:15px;
  font-weight:800;
}

.hearts{
  direction:ltr;

  font-size:36px;

  line-height:1;

  white-space:nowrap;
}

/* =========================================================
   MISSION
========================================================= */

.mission-box{
  flex:0 0 auto;

  margin-top:9px;

  min-height:74px;

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:10px 14px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:27px;

  box-shadow:var(--shadow);

  font-size:
    clamp(21px,5.5vw,30px);

  font-weight:950;

  color:var(--text);
}

.mission-box .target{
  margin-inline-start:8px;
}

/* =========================================================
   GAME INFO
========================================================= */

.game-info{
  flex:0 0 auto;

  display:flex;

  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin:8px 0;
}

.combo{
  min-width:115px;

  padding:11px 16px;

  background:#fff;

  border:1px solid var(--border);
  border-radius:23px;

  text-align:center;

  font-size:18px;
  font-weight:900;

  box-shadow:var(--shadow);
}

.timer{
  min-width:115px;

  padding:11px 16px;

  background:var(--purple);
  color:#fff;

  border-radius:23px;

  text-align:center;

  font-size:18px;
  font-weight:900;

  box-shadow:
    0 10px 25px
    rgba(133,82,223,.25);
}

/* =========================================================
   ARENA
========================================================= */

.arena-wrap{
  flex:1 1 auto;

  min-height:0;

  position:relative;

  border:2px solid #dce6f3;

  border-radius:30px;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(40,100,199,.035),
      transparent 25%
    ),
    radial-gradient(
      circle at 80% 75%,
      rgba(133,82,223,.035),
      transparent 25%
    ),
    rgba(255,255,255,.55);

  overflow:hidden;

  touch-action:pan-y;

  isolation:isolate;
}

.arena{
  position:absolute;
  inset:0;

  overflow:hidden;
}

/* =========================================================
   TARGETS
========================================================= */

.number{
  position:absolute;

  top:0;

  width:70px;
  height:70px;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    rgba(255,255,255,.97);

  border:6px solid var(--blue);

  color:var(--text);

  font-size:25px;
  font-weight:950;

  box-shadow:
    0 7px 18px
    rgba(40,100,199,.13);

  user-select:none;
  -webkit-user-select:none;

  cursor:pointer;

  /*
    الضغط العادي فقط.
    التمرير العمودي لا يجب أن يعتبر ضغطة.
  */
  touch-action:manipulation;

  z-index:5;

  transition:
    transform .12s ease,
    opacity .12s ease;
}

.number:active{
  transform:scale(.9);
}

.number.good{
  animation:
    goodHit .20s ease forwards;
}

.number.bad{
  animation:
    badHit .20s ease forwards;
}

@keyframes goodHit{

  to{
    transform:scale(1.45);
    opacity:0;
  }

}

@keyframes badHit{

  0%{
    transform:translateX(0);
  }

  35%{
    transform:translateX(-8px);
  }

  70%{
    transform:translateX(8px);
  }

  100%{
    transform:scale(.8);
    opacity:0;
  }

}

/* =========================================================
   FEEDBACK
========================================================= */

.feedback{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%);

  font-size:34px;
  font-weight:950;

  pointer-events:none;

  z-index:20;

  animation:
    feedback .65s ease forwards;
}

@keyframes feedback{

  0%{
    opacity:0;

    transform:
      translate(-50%,-40%)
      scale(.7);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;

    transform:
      translate(-50%,-100%)
      scale(1.2);
  }

}

/* =========================================================
   GAME CONTROLS
========================================================= */

.game-controls{
  flex:0 0 auto;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:10px;
}

.control-btn{
  min-height:68px;

  border:0;

  border-radius:25px;

  font-family:inherit;

  font-size:21px;
  font-weight:950;

  cursor:pointer;

  box-shadow:var(--shadow);

  touch-action:manipulation;
}

.control-btn:active{
  transform:scale(.97);
}

.bomb-btn{
  background:
    linear-gradient(
      145deg,
      #f4b321,
      #df9910
    );

  color:#fff;
}

.exit-btn{
  background:
    linear-gradient(
      145deg,
      #315f96,
      #234d82
    );

  color:#fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;

  inset:0;

  background:
    rgba(10,28,50,.60);

  display:flex;

  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;

  overscroll-behavior:contain;
}

.modal.hidden{
  display:none;
}

.modal-card{
  width:min(500px,100%);

  max-height:
    calc(100dvh - 40px);

  overflow:auto;

  background:#fff;

  border-radius:35px;

  padding:28px 20px;

  text-align:center;

  box-shadow:
    0 25px 70px
    rgba(0,0,0,.25);
}

.modal-title{
  margin:0 0 12px;

  font-size:31px;

  color:var(--blue);

  font-weight:950;
}

.modal-text{
  color:var(--muted);

  font-size:18px;

  line-height:1.8;

  font-weight:650;
}

.modal-actions{
  display:grid;

  gap:10px;

  margin-top:20px;
}

.modal-btn{
  min-height:58px;

  border:0;

  border-radius:20px;

  font-family:inherit;

  font-size:19px;

  font-weight:900;

  cursor:pointer;

  touch-action:manipulation;
}

.modal-primary{
  background:var(--blue);
  color:#fff;
}

.modal-secondary{
  background:#eef3fb;
  color:var(--text);
}

/* =========================================================
   MISSION SELECTOR
========================================================= */

.mission-list{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:9px;

  margin-top:15px;
}

.mission-choice{
  min-height:72px;

  border:2px solid var(--border);

  background:#fff;

  border-radius:21px;

  color:var(--text);

  font-family:inherit;

  font-size:16px;
  font-weight:850;

  cursor:pointer;

  touch-action:manipulation;
}

.mission-choice:active{
  transform:scale(.97);
}

.mission-choice:hover{
  border-color:var(--blue);
}

.mission-choice.selected{
  background:#eef4ff;

  border-color:var(--blue);

  color:var(--blue);
}

/* =========================================================
   GAME OVER
========================================================= */

.game-over-score{
  font-size:55px;

  font-weight:950;

  color:var(--purple);

  margin:12px 0;
}

/* =========================================================
   STATS MODAL
========================================================= */

.stats-big{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:10px;

  margin-top:18px;
}

.stats-big div{
  background:#f5f8fd;

  border-radius:22px;

  padding:16px;
}

.stats-big strong{
  display:block;

  color:var(--blue);

  font-size:30px;
}

.stats-big span{
  color:var(--muted);

  font-weight:750;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  #home{
    padding-left:12px;
    padding-right:12px;
  }

  .hero{
    padding-top:28px;
  }

  .logo{
    width:105px;
    height:105px;

    font-size:38px;

    margin-bottom:20px;
  }

  .game-title{
    font-size:44px;
  }

  .game-subtitle{
    font-size:18px;
  }

  .prime-row{
    font-size:21px;
  }

  .menu-btn{
    min-height:160px;
  }

  .menu-title{
    font-size:22px;
  }

  .menu-icon{
    font-size:40px;
  }

  .game-stat{
    min-height:84px;

    border-radius:24px;
  }

  .game-stat-value{
    font-size:32px;
  }

  .game-stat-label{
    font-size:14px;
  }

  .hearts{
    font-size:31px;
  }

  .number{
    width:68px;
    height:68px;

    font-size:24px;
  }

  .control-btn{
    min-height:64px;

    font-size:20px;
  }

}

@media(max-width:360px){

  .menu-grid,
  .home-extra{
    grid-template-columns:1fr;
  }

  .game-stats{
    gap:5px;
  }

  .game-stat{
    min-height:76px;

    border-radius:21px;
  }

  .game-stat-value{
    font-size:28px;
  }

  .game-stat-label{
    font-size:13px;
  }

  .hearts{
    font-size:27px;
  }

  .mission-box{
    font-size:19px;
  }

  .control-btn{
    min-height:60px;

    font-size:18px;
  }

}

/* =========================================================
   SHORT SCREENS
========================================================= */

@media(max-height:700px){

  #gameScreen{
    padding-bottom:
      calc(34px + env(safe-area-inset-bottom));
  }

  .game-stat{
    min-height:68px;
  }

  .game-stat-value{
    font-size:28px;
  }

  .game-stat-label{
    margin-top:3px;
    font-size:13px;
  }

  .hearts{
    font-size:27px;
  }

  .mission-box{
    min-height:60px;
    margin-top:6px;
    font-size:20px;
  }

  .game-info{
    margin:5px 0;
  }

  .combo,
  .timer{
    padding:9px 13px;
    font-size:16px;
  }

  .game-controls{
    margin-top:7px;
  }

  .control-btn{
    min-height:55px;
  }

}

/* =========================================================
   VERY SHORT SCREENS
========================================================= */

@media(max-height:600px){

  .game-stat{
    min-height:58px;
  }

  .game-stat-value{
    font-size:25px;
  }

  .hearts{
    font-size:23px;
  }

  .game-stat-label{
    font-size:11px;
  }

  .mission-box{
    min-height:52px;
    font-size:17px;
  }

  .game-info{
    margin:4px 0;
  }

  .combo,
  .timer{
    padding:7px 10px;
    font-size:14px;
  }

  .control-btn{
    min-height:50px;
    border-radius:20px;
    font-size:16px;
  }

}


/* =========================================================
   PREVENT SELECTION / DRAG
========================================================= */

button{
  -webkit-user-select:none;
  user-select:none;
}

</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     HOME
===================================================== -->

<section id="home">

  <div class="topbar">

    <button
      class="lang-btn active"
      data-lang="ar">
      ع
    </button>

    <button
      class="lang-btn"
      data-lang="fr">
      FR
    </button>

    <button
      class="lang-btn"
      data-lang="en">
      EN
    </button>

  </div>


  <div class="hero">

    <!-- الشعار موجود في الصفحة الرئيسية فقط -->
    <div class="logo">
      √N
    </div>

    <h1
      class="game-title"
      id="homeTitle">
      صائد الأعداد
    </h1>

    <div
      class="game-subtitle"
      id="homeSubtitle">
      رياضيات • سرعة • دقة
    </div>

    <div class="prime-row">
      2 • 3 • 5 • 7 • 11 • 13
    </div>

  </div>


  <!-- ===================================================
       HOME STATS
  ==================================================== -->

  <div class="home-stats">

    <div class="stat-card">

      <div
        class="stat-value"
        id="bestScore">
        0
      </div>

      <div
        class="stat-label"
        id="bestScoreLabel">
        أفضل نتيجة
      </div>

    </div>


    <div class="stat-card">

      <div
        class="stat-value"
        id="gamesPlayed">
        0
      </div>

      <div
        class="stat-label"
        id="gamesLabel">
        المباريات
      </div>

    </div>


    <div class="stat-card">

      <div
        class="stat-value"
        id="bestCombo">
        0
      </div>

      <div
        class="stat-label"
        id="comboLabel">
        أفضل كومبو
      </div>

    </div>

  </div>


  <!-- ===================================================
       GAME MODES
  ==================================================== -->

  <div class="menu-grid">

    <button
      class="menu-btn blue-btn"
      id="missionsBtn">

      <div class="menu-icon">
        🎯

/* =========================================================
   NUMBER LOGIC
========================================================= */

function isPrime(n){

  if(n < 2)
    return false;

  if(n === 2)
    return true;

  if(n % 2 === 0)
    return false;

  for(
    let i=3;
    i*i<=n;
    i+=2
  ){

    if(n%i===0)
      return false;

  }

  return true;

}


function isPerfectSquare(n){

  const r =
    Math.floor(
      Math.sqrt(n)
    );

  return r*r === n;

}


function isDivisor(
  n,
  target
){

  return (
    n > 0 &&
    target % n === 0
  );

}


/* =========================================================
   MISSIONS
========================================================= */

const missions = [

  {
    id:"prime",

    label:"prime",

    test:n =>
      isPrime(n)
  },


  {
    id:"nonPrime",

    label:"nonPrime",

    test:n =>
      n >= 2 &&
      !isPrime(n)
  },


  {
    id:"even",

    label:"even",

    test:n =>
      n % 2 === 0
  },


  {
    id:"odd",

    label:"odd",

    test:n =>
      n % 2 !== 0
  },


  {
    id:"mult3",

    label:"mult3",

    test:n =>
      n % 3 === 0
  },


  {
    id:"mult4",

    label:"mult4",

    test:n =>

  },


  {
    id:"mult5",

    label:"mult5",

    test:n =>
      n % 5 === 0
  },


  {
    id:"square",

    label:"square",

    test:n =>
      isPerfectSquare(n)
  }

];


/* =========================================================
   DYNAMIC MISSION
========================================================= */

function createDynamicMission(){

  const targets =
    [20,30,40,50,60,70];

  const target =
    targets[
      Math.floor(
        Math.random() *
        targets.length
      )
    ];

  const less =
    Math.random() < .5;

  if(less){

    return {

      id:
        "less_" + target,

      textKey:
        "less",

      target,

      test:n =>
        n < target

    };

  }

  return {

    id:
      "greater_" + target,

    textKey:
      "greater",

    target,

    test:n =>
      n > target

  };

}


/* =========================================================
   DIVISOR MISSION
========================================================= */

function createDivisorMission(){

  const targets =
    [
      12,
      18,
      20,
      24,
      30,
      36,
      40,
      48,
      50,
      60
    ];

  const target =
    targets[
      Math.floor(
        Math.random() *
        targets.length
      )
    ];

  return {

    id:
      "divisor_" + target,

    textKey:
      "divisor",

    target,

    test:n =>
      isDivisor(
        n,
        target
      )

  };

}


/* =========================================================
   MISSION FACTORY
========================================================= */

function getMissionById(id){

  if(id === "dynamic")
    return createDynamicMission();

  if(id === "divisor")
    return createDivisorMission();

  const found =
    missions.find(
      m =>
        m.id === id
    );

  return (
    found ||
    missions[0]
  );

}


/* =========================================================
   MISSION TEXT
========================================================= */

function missionText(m){

  if(!m)
    return tr("noMission");

  if(m.textKey === "less"){

    return (
      tr("less") +
      " " +
      m.target
    );

  }

  if(m.textKey === "greater"){

    return (
      tr("greater") +
      " " +
      m.target
    );

  }

  if(m.textKey === "divisor"){

    return (
      tr("divisor") +
      " " +
      m.target
    );

  }

  return tr(m.label);

}

          const mission =
            getMissionById(id);

          closeModal();

          startGame(
            mode,
            mission
          );

        }
      );

    });


  document
    .getElementById(
      "closeMissionModal"
    )
    .addEventListener(
      "click",
      closeModal
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(
  mode,
  mission=null
){

  stopGameLoop();

  game = {

    active:true,

    mode,

    score:0,

    level:1,

    hearts:3,

    combo:0,

    elapsed:0,

    timeLeft:
      mode === "quick"
        ? 60
        : 0,

    selectedMission:
      mission ||
      missions[0],

    bombAvailable:true,

    nextRandomChange:20,

    targets:new Map(),

    targetId:0,

    spawnAccumulator:0,

    speed:.028,

    animationId:null

  };


  arena.innerHTML =
    "";


  home.style.display =
    "none";

  gameScreen.style.display =
    "flex";


  updateGameUI();


  /*
    نبدأ بعدد من الأرقام فوراً.
  */

  for(
    let i=0;
    i<4;
    i++
  ){

    spawnTarget();

  }


  /*
    نتأكد أن هناك رقماً صحيحاً.
  */

  ensureCorrectTarget();


  startGameLoop();

}


/* =========================================================
   GAME UI
========================================================= */

function updateGameUI(){

  document.getElementById(

  document.getElementById(
    "levelValue"

  document.getElementById(

    );

    );

  }
  else if(

  ){

        Math.ceil(
          game.nextRandomChange -
          game.elapsed
        )
      );

function updateMissionText(){

    return;

  document.getElementById(
    "missionText"
  ).textContent =
    missionText(
      game.selectedMission
    );

}


/* =========================================================
   GAME LOOP
========================================================= */

function startGameLoop(){

  let previous =
    performance.now();


  function loop(now){

    if(!game.active)
      return;


    const dt =
      Math.min(
        50,
        now - previous
      );


    previous =
      now;


    updateGame(dt);


    game.animationId =
      requestAnimationFrame(
        loop
      );

  }


  game.animationId =
    requestAnimationFrame(
      loop
    );

}


function stopGameLoop(){

  if(game.animationId){

    cancelAnimationFrame(
      game.animationId
    );

    game.animationId =
      null;

  }

}


/* =========================================================
   UPDATE GAME
========================================================= */

function updateGame(dt){

  const seconds =
    dt / 1000;


  game.elapsed +=
    seconds;


  /*
    السرعة تبدأ بطيئة
    وتزداد تدريجياً.
  */

  game.speed =
    Math.min(
      .115,

      .028 +
      game.elapsed * .00085 +

      (game.level - 1) *
      .004
    );


  /*
    Spawn interval
  */

  const spawnInterval =
    Math.max(
      650,

      1250 -
      game.elapsed * 5 -

      (game.level - 1) *
      60
    );


  game.spawnAccumulator +=
    dt;


  if(
    game.spawnAccumulator >=
    spawnInterval
  ){

    game.spawnAccumulator =
      0;


    const amount =
      game.elapsed > 45
        ? 2
        : 1;


    for(
      let i=0;
      i<amount;
      i++
    ){

      spawnTarget();

    }

  }


  moveTargets(dt);


  /*
    Quick Hunt
    60 ثانية
  */

  if(
    game.mode === "quick"
  ){

    game.timeLeft =
      Math.max(
        0,

        60 -
        Math.floor(
          game.elapsed
        )
      );


    if(
      game.timeLeft <= 0
    ){

      endGame();

      return;

    }

  }


  /*
    Random Challenge
    تغيير حقيقي كل 20 ثانية
  */

  if(
    game.mode === "random"
  ){

    if(
      game.elapsed >=
      game.nextRandomChange
    ){

      changeRandomMission();

      game.nextRandomChange +=
        20;

    }

  }


  /*
    المستوى
  */

  const newLevel =
    1 +
    Math.floor(
      game.score / 10
    );


  if(
    newLevel !==
    game.level
  ){

    game.level =
      newLevel;

  }


  /*
    يجب أن يبقى رقم صحيح
    على الشاشة.
  */

  ensureCorrectTarget();


  updateGameUI();

}


/* =========================================================
   RANDOM MISSION
========================================================= */

function changeRandomMission(){

  const pool = [

    ...missions,

    {
      id:"divisor",
      textKey:"divisor",
      target:24,

      test:n =>
        isDivisor(
          n,
          24
        )
    },

    createDynamicMission()

  ];


  let next =
    pool[
      Math.floor(
        Math.random() *
        pool.length
      )
    ];


  let tries =
    0;


  while(

    game.selectedMission &&

    next.id ===
    game.selectedMission.id &&

    tries < 20

  ){

    next =
      pool[
        Math.floor(
          Math.random() *
          pool.length
        )
      ];

    tries++;

  }


  game.selectedMission =
    next;


  /*
    لا نحذف الأرقام الموجودة.
    المهمة الجديدة تطبق على الأرقام
    الجديدة والموجودة.
  */

  showFeedback(
    tr("randomChange"),
    "gold"
  );


  ensureCorrectTarget();


  updateGameUI();

}


/* =========================================================
   SPAWN TARGET
========================================================= */

function spawnTarget(){

  if(!game.active)
    return;


  const rect =
    arena.getBoundingClientRect();


  if(
    rect.width < 100 ||
    rect.height < 80
  ){

    return;

  }


  const size =
    window.innerWidth <= 380
      ? 68
      : 70;


  const maxX =
    Math.max(
      5,
      rect.width -
      size -
      5
    );


  const x =
    5 +
    Math.random() *
    maxX;


  /*
    الرقم يبدأ فوق المنطقة.
  */

  const y =
    -size -
    Math.random() *
    35;


  const shouldBeCorrect =
    Math.random() < .45;


  let value;


  if(
    shouldBeCorrect
  ){

    value =
      generateCorrectNumber();

  }
  else{

    value =
      generateWrongNumber();

  }


  const id =
    ++game.targetId;


  const el =
    document.createElement(
      "button"
    );


  el.type =
    "button";


  el.className =
    "number";


  el.textContent =
    value;


  el.style.left =
    x + "px";


  /*
    مهم:
    لا نستعمل top=y.
    y يتحكم فيه transform فقط.
  */

  el.style.top =
    "0px";


  el.style.transform =
    `translate3d(0,${y}px,0)`;


  /*
    click فقط.
  */

  el.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      handleTargetClick(id);

    }
  );


  arena.appendChild(
    el
  );


  game.targets.set(
    id,
    {

      id,

      el,

      value,

      x,

      y,

      size,

      speed:
        game.speed *
        (
          .85 +
          Math.random() *
          .30
        )

    }
  );

}


/* =========================================================
   ENSURE CORRECT TARGET
========================================================= */

function ensureCorrectTarget(){

  if(!game.active)
    return;


  let hasCorrect =
    false;


  for(
    const t
    of game.targets.values()
  ){

    if(
      game.selectedMission &&
      game.selectedMission.test(
        t.value
      )
    ){

      hasCorrect =
        true;

      break;

    }

  }


  if(
    !hasCorrect &&
    game.targets.size < 8
  ){

    spawnCorrectTarget();

  }

}

/* =========================================================
   GENERATE CORRECT NUMBER
========================================================= */

function generateCorrectNumber(){

  const mission =
    game.selectedMission;


  if(!mission)
    return 2;


  let value;


  /*
    محاولة عشوائية
  */

  for(
    let i=0;
    i<300;
    i++
  ){

    value =
      2 +
      Math.floor(
        Math.random() *
        99
      );


    if(
      mission.test(value)
    ){

      return value;

    }

  }


  /*
    Fallbacks
  */

  if(
    mission.id === "prime"
  ){

    return [
      2,
      3,
      5,
      7,
      11,
      13
    ][
      Math.floor(
        Math.random()*6
      )
    ];

  }


  if(
    mission.id === "nonPrime"
  ){

    return 4;

  }


  if(
    mission.id === "even"
  ){

    return (
      2 *
      (
        1 +
        Math.floor(
          Math.random()*40
        )
      )
    );

  }


  if(
    mission.id === "odd"
  ){

    return (
      2 *
      Math.floor(
        Math.random()*40
      ) + 1
    );

  }


  if(
    mission.id === "mult3"
  ){

    return (
      3 *
      (
        1 +
        Math.floor(
          Math.random()*30
        )
      )
    );

  }


  if(
    mission.id === "mult4"
  ){

    return (
      4 *
      (
        1 +
        Math.floor(
          Math.random()*20
        )
      )
    );

  }


  if(
    mission.id === "mult5"
  ){

    return (
      5 *
      (
        1 +
        Math.floor(
          Math.random()*19
        )
      )
    );

  }


  if(
    mission.id === "square"
  ){

    return [
      4,
      9,
      16,
      25,
      36,
      49,
      64,
      81
    ][
      Math.floor(
        Math.random()*8
      )
    ];

  }


  if(
    mission.textKey === "less"
  ){

    return Math.max(
      2,
      Math.min(
        99,
        Math.floor(
          mission.target / 2
        )
      )
    );

  }


  if(
    mission.textKey === "greater"
  ){

    return Math.min(
      99,
      mission.target + 10
    );

  }


  if(
    mission.textKey === "divisor"
  ){

    const divisors = [];


    for(
      let n=1;
      n<=mission.target;
      n++
    ){

      if(
        mission.target % n === 0
      ){

        divisors.push(n);

      }

    }


    return divisors[
      Math.floor(
        Math.random() *
        divisors.length
      )
    ];

  }


  return 2;

}


/* =========================================================
   GENERATE WRONG NUMBER
========================================================= */

function generateWrongNumber(){

  const mission =
    game.selectedMission;


  if(!mission)
    return 1;


  let value;


  for(
    let i=0;
    i<300;
    i++
  ){

    value =
      2 +
      Math.floor(
        Math.random()*99
      );


    if(
      !mission.test(value)
    ){

      return value;

    }

  }


  /*
    Fallbacks
  */

  if(
    mission.id === "prime"
  )
    return 4;


  if(
    mission.id === "nonPrime"
  )
    return 2;


  if(
    mission.id === "even"
  )
    return 3;


  if(
    mission.id === "odd"
  )
    return 4;


  if(
    mission.id === "mult3"
  )
    return 10;


  if(
    mission.id === "mult4"
  )
    return 10;


  if(
    mission.id === "mult5"
  )
    return 12;


  if(
    mission.id === "square"
  )
    return 2;


  if(
    mission.textKey === "less"
  )
    return Math.min(
      99,
      mission.target + 10
    );


  if(
    mission.textKey === "greater"
  )
    return Math.max(
      2,
      mission.target - 10
    );


  if(
    mission.textKey === "divisor"
  )
    return 7;


  return 1;

}


/* =========================================================
   MOVE TARGETS
========================================================= */

function moveTargets(dt){

  const rect =
    arena.getBoundingClientRect();


  const height =
    rect.height;


  for(
    const [id,t]
    of game.targets
  ){

    t.y +=
      t.speed *
      dt;


    t.el.style.transform =
      `translate3d(0,${t.y}px,0)`;


    /*
      الخروج من أسفل الشاشة
      لا يعتبر خطأ.
    */

    if(
      t.y >
      height + t.size
    ){

      t.el.remove();

      game.targets.delete(
        id
      );

    }

  }

}


/* =========================================================
   TARGET CLICK
========================================================= */

function handleTargetClick(id){

  if(!game.active)
    return;


  const t =
    game.targets.get(id);


  if(!t)
    return;


  const correct =
    game.selectedMission.test(
      t.value
    );


  if(correct){

    handleCorrect(t);

  }
  else{

    handleWrong(t);

  }

}


/* =========================================================
   CORRECT
========================================================= */

function handleCorrect(t){

  if(
    !game.targets.has(
      t.id
    )
  )
    return;


  game.targets.delete(
    t.id
  );


  t.el.classList.add(
    "good"
  );


  setTimeout(
    ()=>{
      t.el.remove();
    },
    180
  );


  game.combo++;


  const points =
    1 +
    Math.floor(
      game.combo / 5
    );


  game.score +=
    points;


  playSound(
    "correct"
  );


  showFeedback(
    "+" + points,
    "good"
  );


  updateGameUI();

}


/* =========================================================
   WRONG
========================================================= */

function handleWrong(t){

  if(
    !game.targets.has(
      t.id
    )
  )
    return;


  game.targets.delete(
    t.id
  );


  t.el.classList.add(
    "bad"
  );


  setTimeout(
    ()=>{
      t.el.remove();
    },
    200
  );


  game.combo =
    0;


  game.hearts =
    Math.max(
      0,
      game.hearts - 1
    );


  playSound(
    "wrong"
  );


  showFeedback(
    tr("wrong"),
    "bad"
  );


  updateGameUI();


  if(
    game.hearts <= 0
  ){

    setTimeout(
      endGame,
      250
    );

  }

}


/* =========================================================
   BOMB
========================================================= */

function useBomb(){

  if(!game.active)
    return;


  if(!game.bombAvailable)
    return;


  game.bombAvailable =
    false;


  for(
    const [id,t]
    of game.targets
  ){

    t.el.classList.add(
      "good"
    );


    setTimeout(
      ()=>{
        t.el.remove();
      },
      160
    );


    game.targets.delete(
      id
    );

  }


  playSound(
    "bomb"
  );


  showFeedback(
    tr("bombUsed"),
    "gold"
  );


  updateGameUI();


  /*
    نضع رقماً صحيحاً جديداً
    بعد القنبلة.
  */

  setTimeout(
    ()=>{
      if(game.active)
        spawnCorrectTarget();
    },
    180
  );

}


/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(
  text,
  type
){

  const old =
    arena.querySelector(
      ".feedback"
    );


  if(old)
    old.remove();


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "feedback";


  el.textContent =
    text;


  if(
    type === "good"
  ){

    el.style.color =
      "var(--green)";

  }
  else if(
    type === "bad"
  ){

    el.style.color =
      "var(--red)";

  }
  else{

    el.style.color =
      "var(--gold)";

  }


  arena.appendChild(
    el
  );


  setTimeout(
    ()=>{
      el.remove();
    },
    650
  );

}


/* =========================================================
   GAME OVER
========================================================= */

  game.active =

/* =========================================================
   AUDIO
========================================================= */

let audioContext =
  null;


function getAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;


    if(!AudioCtx)
      return null;


    audioContext =
      new AudioCtx();

  }


  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext
      .resume()
      .catch(
        ()=>{}
      );

  }


  return audioContext;

}


function playSound(type){

  const ctx =
    getAudio();


  if(!ctx)
    return;


  const osc =
    ctx.createOscillator();


  const gain =
    ctx.createGain();


  osc.connect(
    gain
  );


  gain.connect(
    ctx.destination
  );


  let frequency =
    500;

  let duration =
    .09;


  if(
    type === "correct"
  ){

    frequency =
      720;

    duration =
      .08;

  }


  if(
    type === "wrong"
  ){

    frequency =
      180;

    duration =
      .16;

  }


  if(
    type === "bomb"
  ){

    frequency =
      100;

    duration =
      .25;

  }


  if(
    type === "gameover"
  ){

    frequency =
      130;

    duration =
      .4;

  }


  osc.frequency.value =
    frequency;


  osc.type =
    type === "bomb"
      ? "sawtooth"
      : "sine";


  gain.gain.setValueAtTime(
    .001,
    ctx.currentTime
  );


  gain.gain
    .exponentialRampToValueAtTime(
      .12,
      ctx.currentTime + .01
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .001,
      ctx.currentTime + duration
    );


  osc.start();


  osc.stop(
    ctx.currentTime +
    duration
  );

}
