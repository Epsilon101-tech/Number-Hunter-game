     ======================================================= -->

<div
  id="resetModal"
  class="modal reset-confirm">

  <div class="modal-card">

    <div class="modal-icon">
      🔄
    </div>

    <h2
      id="resetTitle"
      class="modal-title">
      إعادة الإحصائيات
    </h2>

    <div
      id="resetText"
      class="modal-text">

      هل تريد حذف جميع الإحصائيات؟

    </div>

    <div class="modal-actions">

      <button
        id="confirmResetBtn"
        class="modal-btn primary-modal">
        نعم
      </button>

      <button
        id="cancelResetBtn"
        class="modal-btn secondary-modal">
        إلغاء
      </button>

    </div>

  </div>

</div>
