<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>NUMBER HUNTER</title>

<style>

:root{
--blue:#2864c7;
--blue2:#3d73dc;
--purple:#8552df;
--gold:#e8a51a;
--green:#21a66f;
--red:#e5484d;
--bg:#f4f7fd;
--card:#ffffff;
--text:#17335f;
--muted:#71809a;
--border:#dce5f2;
--shadow:0 12px 35px rgba(40,100,199,.12);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
font-family:
system-ui,
-apple-system,
"Segoe UI",
Arial,sans-serif;
color:var(--text);
}

button{
font:inherit;
}

button:focus{
outline:none;
}

#app{
position:fixed;
inset:0;
width:100%;
height:100%;
height:100dvh;
overflow:hidden;
}

/* =========================
   SCREENS
========================= */

.screen{
position:absolute;
inset:0;
display:none;

overflow-y:auto;
overflow-x:hidden;

padding:
calc(env(safe-area-inset-top,0px) + 18px)
18px
calc(env(safe-area-inset-bottom,0px) + 115px);
}

.screen.active{
display:block;
}

/* =========================
   HOME
========================= */

.home-wrap{
width:min(720px,100%);
margin:auto;
}

.hero{
position:relative;
overflow:hidden;

background:
linear-gradient(
145deg,
#ffffff,
#f7f3ff
);

border:1px solid var(--border);
border-radius:36px;

padding:30px 22px;

text-align:center;

box-shadow:var(--shadow);

margin-bottom:18px;
}

.hero:before,
.hero:after{
content:"";
position:absolute;
border-radius:50%;
pointer-events:none;
}

.hero:before{
width:220px;
height:220px;
left:-120px;
bottom:-110px;
background:rgba(61,115,220,.08);
}

.hero:after{
width:200px;
height:200px;
right:-100px;
top:-110px;
background:rgba(133,82,223,.08);
}

.logo{
width:118px;
height:118px;

margin:auto;
margin-bottom:18px;

border-radius:32px;

background:
linear-gradient(
145deg,
#3175dc,
#1f58bd
);

display:grid;
place-items:center;

color:#fff;

font-size:34px;
font-weight:950;

box-shadow:
0 18px 38px rgba(40,100,199,.28);

position:relative;
z-index:2;
}

.hero h1{
margin:0;

font-size:
clamp(42px,11vw,66px);

line-height:.98;

letter-spacing:-2px;

font-weight:950;

color:#285dad;

position:relative;
z-index:2;
}

.hero p{
margin:20px 0 10px;

font-size:21px;

color:#6e7a91;

font-weight:800;

position:relative;
z-index:2;
}

.primes{
font-size:28px;
font-weight:950;
color:var(--purple);
letter-spacing:2px;
position:relative;
z-index:2;
}

/* =========================
   HOME STATS
========================= */

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:#fff;
border:1px solid var(--border);

border-radius:25px;

padding:15px 8px;

text-align:center;

box-shadow:var(--shadow);
}

.stat b{
display:block;
font-size:32px;
line-height:1;
color:var(--blue);
}

.stat span{
display:block;
margin-top:7px;
font-size:14px;
color:var(--muted);
font-weight:800;
}

/* =========================
   MODES
========================= */

.modes{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.mode{
border:0;

border-radius:30px;

padding:22px 18px;

min-height:150px;

text-align:right;

color:#fff;

box-shadow:
0 15px 30px rgba(40,100,199,.18);

cursor:pointer;

touch-action:manipulation;
}

.mode:active{
transform:scale(.98);
}

.mode.blue{
background:
linear-gradient(
145deg,
#3475dc,
#2860c4
);
}

.mode.purple{
background:
linear-gradient(
145deg,
#9657e8,
#7843d4
);
}

.mode.gold{
background:
linear-gradient(
145deg,
#f0b331,
#d99513
);
}

.mode.navy{
background:
linear-gradient(
145deg,
#315b91,
#183e70
);
}

.mode .ico{
display:block;
font-size:42px;
margin-bottom:7px;
}

.mode h3{
margin:0 0 5px;
font-size:24px;
}

.mode p{
margin:0;
font-size:14px;
opacity:.92;
}

/* =========================
   SECONDARY
========================= */

.secondary{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:14px;
}

.secondary button{
min-height:82px;

border:1px solid var(--border);

background:#fff;

border-radius:26px;

color:var(--text);

font-size:18px;
font-weight:900;

box-shadow:var(--shadow);

cursor:pointer;

touch-action:manipulation;
}

.lang-row{
display:flex;
justify-content:center;
gap:8px;

margin-top:16px;

flex-wrap:wrap;
}

.lang{
border:1px solid var(--border);

background:#fff;

border-radius:16px;

padding:9px 14px;

color:var(--text);

font-weight:900;

cursor:pointer;

touch-action:manipulation;
}

.lang.active{
background:var(--blue);
color:#fff;
}

/* =========================
   CHOICE SCREEN
========================= */

.choice-screen{
padding-top:
calc(env(safe-area-inset-top,0px) + 22px);
}

.choice-wrap{
width:min(680px,100%);
margin:auto;
}

.back{
border:1px solid var(--border);
background:#fff;

color:var(--text);

padding:11px 18px;

border-radius:17px;

font-weight:950;

cursor:pointer;

touch-action:manipulation;
}

.choice-title{
text-align:center;
font-size:31px;
margin:25px 0 8px;
}

.choice-sub{
text-align:center;
color:var(--muted);
margin:0 0 20px;
font-weight:700;
}

.mission-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.mission-card{
border:1px solid var(--border);

background:#fff;

border-radius:23px;

padding:18px;

text-align:right;

box-shadow:var(--shadow);

cursor:pointer;

touch-action:manipulation;
}

.mission-card:active{
transform:scale(.98);
}

.mission-card b{
display:block;
font-size:20px;
}

.mission-card span{
display:block;
margin-top:6px;

font-size:13px;

color:var(--muted);
}

/* =========================
   GAME
========================= */

#gameScreen{
background:
radial-gradient(
circle at 15% 20%,
rgba(61,115,220,.10),
transparent 28%
),
radial-gradient(
circle at 85% 70%,
rgba(133,82,223,.07),
transparent 30%
),
#f4f7fd;
}

.game-shell{
position:absolute;
inset:0;

width:100%;
height:100%;
height:100dvh;

overflow:hidden;
}

/* =========================
   TOP STATS
========================= */

.topbar{
position:absolute;

z-index:30;

top:
max(
8px,
calc(env(safe-area-inset-top,0px) + 5px)
);

left:10px;
right:10px;

display:grid;
grid-template-columns:
1fr 1.15fr 1fr;

gap:8px;
}

.game-stat{
background:rgba(255,255,255,.97);

border:1px solid var(--border);

border-radius:25px;

min-height:74px;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

box-shadow:
0 8px 22px rgba(40,100,199,.10);

font-weight:950;
}

.game-stat b{
font-size:27px;
color:var(--blue);
}

.game-stat span{
font-size:14px;
color:var(--muted);
}

/* =========================
   GAME LOGO
========================= */

.game-logo{
position:absolute;

z-index:20;

top:
max(
91px,
calc(env(safe-area-inset-top,0px) + 82px)
);

left:50%;

transform:translateX(-50%);

width:86px;
height:86px;

border-radius:26px;

background:
linear-gradient(
145deg,
#3175dc,
#1f58bd
);

display:grid;
place-items:center;

color:#fff;

font-size:26px;
font-weight:950;

box-shadow:
0 12px 30px rgba(40,100,199,.22);
}

/* =========================
   MISSION
========================= */

.mission-display{
position:absolute;

z-index:18;

left:14px;
right:14px;

top:
max(
181px,
calc(env(safe-area-inset-top,0px) + 171px)
);

min-height:70px;

background:rgba(255,255,255,.97);

border:1px solid var(--border);

border-radius:25px;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

padding:10px 16px;

font-size:20px;

font-weight:950;

color:var(--text);

box-shadow:var(--shadow);
}

/* =========================
   ARENA
========================= */

#arena{
position:absolute;

left:9px;
right:9px;

top:
max(
260px,
calc(env(safe-area-inset-top,0px) + 250px)
);

bottom:
max(
92px,
calc(env(safe-area-inset-bottom,0px) + 84px)
);

overflow:hidden;

border:
1px solid rgba(40,100,199,.14);

border-radius:30px;

background:
rgba(255,255,255,.58);

box-shadow:
inset 0 0 50px
rgba(40,100,199,.04);

touch-action:none;

user-select:none;
-webkit-user-select:none;
}

/* =========================
   NUMBERS
========================= */

.number{
position:absolute;

width:68px;
height:68px;

border-radius:50%;

border:6px solid #4d82d6;

background:
rgba(255,255,255,.98);

display:grid;

place-items:center;

color:#234f8f;

font-size:22px;

font-weight:950;

box-shadow:
0 10px 25px
rgba(40,100,199,.13);

cursor:pointer;

touch-action:none;

transform:
translate(-50%,-50%);

will-change:transform;

z-index:3;
}

.number:active{
transform:
translate(-50%,-50%)
scale(.90);
}

.number.hit{
animation:hit .15s ease;
}

@keyframes hit{
0%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.18)}
100%{transform:translate(-50%,-50%) scale(.2);opacity:0}
}

/* =========================
   TIMER / COMBO
========================= */

.timer,
.combo{
position:absolute;

z-index:25;

top:
max(
260px,
calc(env(safe-area-inset-top,0px) + 250px)
);

transform:translateY(-6px);

border-radius:17px;

padding:8px 12px;

font-weight:950;

box-shadow:
0 7px 20px rgba(40,100,199,.12);
}

.timer{
right:18px;
background:var(--purple);
color:#fff;
}

.combo{
left:18px;
background:#fff;
color:var(--blue);
border:1px solid var(--border);
}

/* =========================
   CONTROLS
========================= */

.controls{
position:absolute;

z-index:40;

left:12px;
right:12px;

bottom:
max(
17px,
calc(env(safe-area-inset-bottom,0px) + 15px)
);

display:flex;

justify-content:space-between;

align-items:center;

pointer-events:none;
}

.controls button{
pointer-events:auto;

height:54px;

border-radius:19px;

border:1px solid var(--border);

box-shadow:
0 10px 24px rgba(40,100,199,.14);

font-weight:950;

cursor:pointer;

touch-action:manipulation;
}

.exit-btn{
width:58px;

background:
linear-gradient(
145deg,
#315b91,
#183e70
);

color:#fff;

font-size:23px;
}

.bomb-btn{
min-width:116px;

padding:0 15px;

background:#fff;

color:var(--text);

font-size:16px;
}

.bomb-btn:disabled{
opacity:.45;
}

/* =========================
   GAME OVER
========================= */

.overlay{
position:absolute;

inset:0;

z-index:100;

background:
rgba(13,26,47,.52);

display:none;

align-items:center;
justify-content:center;

padding:25px;
}

.overlay.show{
display:flex;
}

.dialog{
width:min(430px,100%);

background:#fff;

border-radius:30px;

padding:28px 22px;

text-align:center;

box-shadow:
0 25px 60px
rgba(10,25,50,.3);
}

.dialog .big{
font-size:55px;
}

.dialog h2{
margin:8px 0;
font-size:30px;
}

.dialog p{
color:var(--muted);

font-weight:700;

line-height:1.7;
}

.dialog-actions{
display:flex;
gap:10px;
}

.dialog button{
flex:1;

border:0;

border-radius:18px;

padding:14px;

font-weight:950;

cursor:pointer;

touch-action:manipulation;
}

.primary{
background:var(--blue);
color:#fff;
}

.secondary-btn{
background:#edf2fa;
color:var(--text);
}

/* =========================
   MODALS
========================= */

.modal{
position:fixed;

inset:0;

z-index:500;

background:
rgba(13,26,47,.50);

display:none;

align-items:center;
justify-content:center;

padding:24px;
}

.modal.show{
display:flex;
}

.modal-card{
width:min(430px,100%);

background:#fff;

border-radius:30px;

padding:27px 22px;

text-align:center;

box-shadow:
0 25px 65px
rgba(10,25,50,.3);
}

.modal-icon{
font-size:50px;
}

.modal-title{
font-size:28px;

margin:7px 0;

color:var(--text);
}

.modal-text{
color:var(--muted);

font-weight:700;

line-height:1.8;

margin-bottom:18px;
}

.modal-actions{
display:flex;
gap:10px;
}

.modal-btn{
flex:1;

border:0;

border-radius:18px;

padding:14px;

font-weight:950;

cursor:pointer;

touch-action:manipulation;
}

.primary-modal{
background:var(--red);
color:#fff;
}

.secondary-modal{
background:#edf2fa;
color:var(--text);
}

/* =========================
   TOAST
========================= */

.toast{
position:fixed;

z-index:600;

left:50%;

bottom:
max(
90px,
calc(env(safe-area-inset-bottom,0px) + 90px)
);

transform:
translate(-50%,15px);

width:min(
430px,
calc(100% - 40px)
);

padding:15px 18px;

border-radius:20px;

background:var(--blue);

color:#fff;

text-align:center;

font-weight:900;

opacity:0;

pointer-events:none;

transition:.25s;
}

.toast.show{
opacity:1;

transform:
translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

.modes{
gap:11px;
}

.mode{
min-height:145px;
padding:19px 15px;
}

.mode h3{
font-size:22px;
}

.stats-grid{
gap:8px;
}

.stat{
border-radius:22px;
}

.number{
width:62px;
height:62px;

font-size:20px;

border-width:5px;
}

.mission-display{
font-size:18px;
}

.mission-grid{
grid-template-columns:1fr;
}

.game-stat{
min-height:70px;
}

.game-stat b{
font-size:25px;
}

}

@media(max-height:700px){

.game-logo{
top:
max(
78px,
calc(env(safe-area-inset-top,0px) + 70px)
);

width:72px;
height:72px;
border-radius:22px;
}

.mission-display{
top:
max(
155px,
calc(env(safe-area-inset-top,0px) + 147px)
);

min-height:60px;
}

.timer,
.combo{
top:
max(
228px,
calc(env(safe-area-inset-top,0px) + 220px)
);
}

#arena{
top:
max(
230px,
calc(env(safe-area-inset-top,0px) + 222px)
);
}

}

</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     HOME
===================================================== -->

<section
id="homeScreen"
class="screen active">

<div class="home-wrap">

<div class="hero">

<div class="logo">
√N
</div>

<h1>
NUMBER<br>
HUNTER
</h1>

<p id="heroTag">
رياضيات • سرعة • دقة
</p>

<div class="primes">
13 · 11 · 7 · 5 · 3 · 2
</div>

</div>


<div class="stats-grid">

<div class="stat">
<b id="bestScore">0</b>
<span id="bestScoreLabel">
أفضل نتيجة
</span>
</div>

<div class="stat">
<b id="games">0</b>
<span id="gamesLabel">
المباريات
</span>
</div>

<div class="stat">
<b id="bestCombo">0</b>
<span id="bestComboLabel">
أفضل كومبو
</span>
</div>

</div>


<div class="modes">

<button
class="mode blue"
id="missionMode"
type="button">

<span class="ico">🎯</span>

<h3 id="missionModeTitle">
المطاردة
</h3>

<p id="missionModeDesc">
اختر المهمة الرياضية
</p>

</button>


<button
class="mode purple"
id="quickMode"
type="button">

<span class="ico">⚡</span>

<h3 id="quickModeTitle">
الصيد السريع
</h3>

<p id="quickModeDesc">
60 ثانية • احصد أكبر عدد
</p>

</button>


<button
class="mode gold"
id="randomMode"
type="button">

<span class="ico">🎲</span>

<h3 id="randomModeTitle">
التحدي العشوائي
</h3>

<p id="randomModeDesc">
مهمة جديدة كل 20 ثانية
</p>

</button>


<button
class="mode navy"
id="survivalMode"
type="button">

<span class="ico">❤️</span>

<h3 id="survivalModeTitle">
البقاء
</h3>

<p id="survivalModeDesc">
3 قلوب • لا تخطئ
</p>

</button>

</div>


<div class="secondary">

<button
id="howBtn"
type="button">

ℹ️
<span id="howText">
طريقة اللعب
</span>

</button>


<button
id="resetBtn"
type="button">

🔄
<span id="resetText">
إعادة الإحصائيات
</span>

</button>

</div>


<div class="lang-row">

<button
class="lang active"
data-lang="ar"
type="button">
العربية
</button>

<button
class="lang"
data-lang="fr"
type="button">
Français
</button>

<button
class="lang"
data-lang="en"
type="button">
English
</button>

</div>

</div>

</section>


<!-- =====================================================
     MISSION CHOICE
===================================================== -->

<section
id="choiceScreen"
class="screen choice-screen">

<div class="choice-wrap">

<button
class="back"
id="choiceBack"
type="button">

←
<span id="choiceBackText">
رجوع
</span>

</button>

<h2
class="choice-title"
id="choiceTitle">
اختر المهمة
</h2>

<p
class="choice-sub"
id="choiceSub">
اختر نوع التحدي الرياضي ثم ابدأ اللعب
</p>

<div
class="mission-grid"
id="missionGrid">
</div>

</div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section
id="gameScreen"
class="screen">

<div class="game-shell">


<div class="topbar">

<div class="game-stat">

<b id="score">
0
</b>

<span id="scoreLabel">
النقاط
</span>

</div>


<div class="game-stat">

<b id="hearts">
❤️ ❤️ ❤️
</b>

<span id="heartsLabel">
القلوب
</span>

</div>


<div class="game-stat">

<b id="level">
1
</b>

<span id="levelLabel">
المستوى
</span>

</div>

</div>


<div class="game-logo">
√N
</div>


<div
class="mission-display"
id="missionDisplay">
🎯 المهمة
</div>


<div
class="timer"
id="timer"
style="display:none">
</div>


<div
class="combo"
id="combo">
🔥 ×0
</div>


<div id="arena">
</div>


<div class="controls">

<button
class="exit-btn"
id="exitBtn"
type="button">
✕
</button>


<button
class="bomb-btn"
id="bombBtn"
type="button">

💣

<span id="bombText">
قنبلة
</span>

</button>

</div>

</div>


<div
class="overlay"
id="gameOverOverlay">

<div class="dialog">

<div
class="big"
id="overIcon">
💔
</div>

<h2
id="overTitle">
انتهت اللعبة
</h2>

<p
id="overText">
</p>

<div class="dialog-actions">

<button
class="primary"
id="againBtn"
type="button">
العب من جديد
</button>

<button
class="secondary-btn"
id="homeBtn"
type="button">
الرئيسية
</button>

</div>

</div>

</div>

</section>


<!-- =====================================================
     RESET MODAL
     خارج اللعبة
===================================================== -->

<div
class="modal"
id="resetModal">

<div class="modal-card">

<div class="modal-icon">
🔄
</div>

<h2
class="modal-title"
id="resetTitle">
إعادة الإحصائيات
</h2>

<div
class="modal-text"
id="resetQuestion">

function randomInt(min,max){

return Math.floor(
Math.random()*(max-min+1)
)+min;

}


/* =====================================================
   PRIME
===================================================== */

function isPrime(n){

if(n<2)return false;

if(n===2)return true;

if(n%2===0)return false;

for(
let i=3;
i*i<=n;
i+=2
){

if(n%i===0)
return false;

}

return true;

}


/* =====================================================
   MAKE MISSION
===================================================== */

function makeMission(id){

if(!id){

return makeMission(
missions[
randomInt(
0,
missions.length-1
)
].id
);

}


const base=
missions.find(
m=>m.id===id
);


const mission={
...base
};


if(id==="divisor"){

mission.target=
randomInt(12,36);

}


if(
id==="greater" ||
id==="less"
){

mission.target=
randomInt(25,55);

}


return mission;

}

/* =====================================================
   CORRECT LOGIC
===================================================== */

function correctFor(n,m){

if(!m)
return false;


switch(m.id){

case"prime":

return isPrime(n);


case"nonprime":

/*
1 ليس عددًا أوليًا
لذلك هو غير أولي
*/

return !isPrime(n);


case"even":

return n%2===0;


case"odd":

return n%2!==0;


case"multiple3":

return n%3===0;


case"multiple4":

return n%4===0;


case"multiple5":

return n%5===0;


case"square":

return Number.isInteger(
Math.sqrt(n)
);


case"divisor":

return m.target%n===0;


case"greater":

return n>m.target;


case"less":

return n<m.target;


default:

return false;

}

}

/* =====================================================
   SPAWN CONFIG
===================================================== */

function getSpawnConfig(){

const seconds=
state.elapsed/1000;


/*
السرعة:

تبدأ تقريبًا 34px/s
ثم ترتفع تدريجيًا
*/

const speed=
Math.min(
125,
34+
seconds*1.45+
(state.level-1)*4
);


/*
الفاصل بين الموجات
يقل تدريجيًا
*/

const interval=
Math.max(
430,
1000-
seconds*8-
(state.level-1)*30
);


/*
الكثافة:

2 → 3 → 4 → 5
بشكل تدريجي
*/

const count=
Math.min(
5,
2+
Math.floor(seconds/22)
);


return{
speed,
interval,
count
};

}


/* =====================================================
   SPAWN TARGET
===================================================== */

function spawnTarget(){

if(!state.running)
return;


const arena=
$("arena");

const rect=
arena.getBoundingClientRect();


if(
rect.width<100 ||
rect.height<100
)return;


const cfg=
getSpawnConfig();


const number=
randomInt(1,99);

const id=
++state.id;


const el=
document.createElement("div");

el.className=
"number";

el.dataset.id=
id;

el.textContent=
number;


const pad=38;

const x=
randomInt(
pad,
Math.max(
pad+1,
Math.floor(rect.width-pad)
)
);


/*
كل الأرقام تبدأ من أعلى
ثم تسقط.
*/

const y=-40;

el.style.left=
x+"px";

el.style.top=
y+"px";


arena.appendChild(el);


state.targets.set(
id,
{
id,
n:number,
x,
y,
speed:cfg.speed,
el
}
);

}


/* =====================================================
   SPAWN WAVE
===================================================== */

function spawnWave(){

if(!state.running)
return;


const cfg=
getSpawnConfig();


for(
let i=0;
i<cfg.count;
i++
){

setTimeout(
()=>{

if(state.running)
spawnTarget();

},
i*100
);

}


scheduleSpawn(
cfg.interval
);

}


/* =====================================================
   SCHEDULE
===================================================== */

function scheduleSpawn(ms){

clearTimeout(
state.spawnTimer
);

state.spawnTimer=
setTimeout(
spawnWave,
ms
);

}


/* =====================================================
   ANIMATION
===================================================== */

function animate(now){

if(!state.running)
return;


const arena=
$("arena");

const height=
arena.clientHeight;


state.elapsed=
(now-state.startTime)/1000;


/*
المستوى يرتفع كل 8 ثوان
*/

const newLevel=
Math.floor(
state.elapsed/8
)+1;


if(
newLevel!==state.level
){

state.level=
newLevel;

$("level").textContent=
state.level;

}


/*
تحريك الأرقام
*/

for(
const [id,obj]
of state.targets
){

obj.y+=
obj.speed/60;


obj.el.style.transform=
`
translate(-50%,-50%)
translateY(${obj.y}px)
`;


/*
إذا خرج الرقم من منطقة اللعب
يختفي فقط.
لا يعتبر خطأ.
*/

if(
obj.y>
height+60
){

obj.el.remove();

state.targets.delete(id);

}

}


/*
QUICK HUNT
*/

if(state.mode==="quick"){

const left=
Math.max(
0,
60-state.elapsed
);

$("timer").textContent=
"⏱ "+
Math.ceil(left)+
" "+
t("seconds");


if(left<=0){

endGame(
"TIME_UP"
);

return;

}

}


/*
RANDOM CHALLENGE

المهمة تتغير كل 20 ثانية
*/

if(state.mode==="random"){

const bucket=
Math.floor(
state.elapsed/20
);


const remaining=
20-
(state.elapsed%20);


$("timer").textContent=
"🎲 "+
Math.ceil(remaining)+
" "+
t("seconds");


if(
bucket!==state.randomBucket
){

state.randomBucket=
bucket;

if(bucket>0){

nextRandomMission();

}

}

}


state.raf=
requestAnimationFrame(
animate
);

}

/*

نقاط + كومبو
*/

state.combo++;

state.bestComboRun=
Math.max(
state.bestComboRun,
state.combo
);


/*
النقاط تزداد مع الكومبو
*/

const points=
10+
Math.min(
30,
(state.combo-1)*2
);

state.score+=points;

$("score").textContent=
state.score;

updateCombo();

sound("correct");


/*
رسالة صغيرة عند الكومبو
*/

if(
state.combo>0 &&
state.combo%10===0
){

toast(
t("levelUp")
);

}


}else{

/*
الإجابة الخاطئة:
قلب ناقص
كومبو = صفر
*/

state.hearts--;

state.combo=0;

updateHearts();

updateCombo();

sound("wrong");

toast(
t("wrong")
);


/*
ثلاثة أخطاء = Game Over
*/

if(state.hearts<=0){

endGame(
"GAME_OVER"
);

}

}

}


/* =====================================================
   BOMB
===================================================== */

function useBomb(){

if(
!state.running ||
!state.bombReady
)return;


/*
القنبلة تمسح جميع الأرقام الظاهرة.
لا تعطي نقاطًا ولا تخصم قلبًا.
*/

clearTargets();

sound("bomb");

state.bombReady=false;

$("bombBtn").disabled=true;


let seconds=8;


$("bombText").textContent=
t("bombWait")+
" "+
seconds;


clearInterval(
state.bombCooldown
);


state.bombCooldown=
setInterval(
()=>{

seconds--;


if(seconds<=0){

clearInterval(
state.bombCooldown
);

state.bombReady=true;

$("bombBtn").disabled=false;

$("bombText").textContent=
t("bomb");

}else{

$("bombText").textContent=
t("bombWait")+
" "+
seconds;

}

},
1000
);

}


/* =====================================================
   CLEAR TARGETS
===================================================== */

function clearTargets(){

for(
const obj
of state.targets.values()
){

obj.el.remove();

}

state.targets.clear();

}


/* =====================================================
   AUDIO
===================================================== */

function sound(type){

try{

const AudioContext=
window.AudioContext ||
window.webkitAudioContext;

if(!AudioContext)
return;


if(!window.nhAudio){

window.nhAudio=
new AudioContext();

}


const ctx=
window.nhAudio;


const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();


oscillator.type=
type==="wrong"
?"sawtooth"
:"sine";


if(type==="correct"){

oscillator.frequency.value=
620;

}

else if(type==="bomb"){

oscillator.frequency.value=
180;

}

else{

oscillator.frequency.value=
150;

}


gain.gain.setValueAtTime(
.0001,
ctx.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.08,
ctx.currentTime+.01
);

gain.gain.exponentialRampToValueAtTime(
.0001,
ctx.currentTime+.13
);


oscillator.connect(gain);

gain.connect(
ctx.destination
);


oscillator.start();

oscillator.stop(
ctx.currentTime+.14
);

}catch(e){}

}


/* =====================================================
   START GAME
===================================================== */

function startGame(mode,mission){

stopGame(false);


state.mode=
mode;

state.mission=
mission ||
makeMission();


state.score=0;

state.hearts=3;

state.combo=0;

state.bestComboRun=0;

state.level=1;

state.running=true;

state.startTime=
performance.now();

state.elapsed=0;

state.id=0;

state.randomBucket=-1;

state.bombReady=true;


$("score").textContent="0";

$("level").textContent="1";

$("bombBtn").disabled=false;

$("bombText").textContent=
t("bomb");


updateHearts();

updateCombo();

updateMissionDisplay();


$("gameOverOverlay")
.classList.remove("show");


$("timer").style.display=
(
mode==="quick" ||
mode==="random"
)
?"block"
:"none";


if(mode==="quick"){

$("timer").textContent=
"⏱ 60 "+
t("seconds");

}

if(mode==="random"){

$("timer").textContent=
"🎲 20 "+
t("seconds");

}


clearTargets();


showScreen(
"gameScreen"
);


/*
البداية خفيفة:
رقمان فقط.
*/

spawnTarget();

spawnTarget();


scheduleSpawn(1000);


state.raf=
requestAnimationFrame(
animate
);

}


/* =====================================================
   STOP GAME
===================================================== */

function stopGame(count){

state.running=false;


clearTimeout(
state.spawnTimer
);


cancelAnimationFrame(
state.raf
);


clearInterval(
state.bombCooldown
);


clearTargets();


if(count){

stats.games++;


stats.bestScore=
Math.max(
stats.bestScore,
state.score
);


stats.bestCombo=
Math.max(
stats.bestCombo,
state.bestComboRun
);


saveStats();

updateStatsUI();

}

}


/* =====================================================
   END GAME
===================================================== */

function endGame(reason){

if(!state.running)
return;


stopGame(true);


if(reason==="TIME_UP"){

$("overIcon").textContent="⏱️";

$("overTitle").textContent=
t("timeUp");

}else{

$("overIcon").textContent="💔";

$("overTitle").textContent=
t("gameOver");

}


$("overText").textContent=
t("finalScore")+
": "+
state.score+
" • "+
t("finalCombo")+
": "+
state.bestComboRun;


$("gameOverOverlay")
.classList.add("show");

}


/* =====================================================
   EXIT GAME
===================================================== */

function exitGame(){

stopGame(true);

$("gameOverOverlay")
.classList.remove("show");

showScreen(
"homeScreen"
);

applyLanguage();

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

const el=
$("toast");

el.textContent=
message;

el.classList.add("show");


clearTimeout(
window.nhToastTimer
);


window.nhToastTimer=
setTimeout(
()=>{

el.classList.remove("show");

},
1700
);

}


/* =====================================================
   REAL TOUCH / POINTER
===================================================== */

/*
مهم جدًا:

نستعمل pointerdown للأرقام فقط.

لا نستعمل click للأرقام.

وبالتالي:
Scroll ≠ ضغط على الرقم.
Touch/ضغط حقيقي = إصابة.
*/

$("arena")
.addEventListener(
"pointerdown",
function(event){

const number=
event.target.closest(
".number"
);


if(!number)
return;


event.preventDefault();

event.stopPropagation();


hitTarget(number);

},
{
passive:false
}
);

.classList.add("show");

.addEventListener(

$("resetModal")
.classList.remove("show");

);

.addEventListener(

games:0,

updateStatsUI();


$("resetModal")
.classList.remove("show");

);

/* =====================================================

===================================================== */

.addEventListener(

.classList.add("show");

);

.addEventListener(

.classList.remove("show");

   LANGUAGE
===================================================== */

document
.querySelectorAll(".lang")
.forEach(
button=>{

button.addEventListener(
"click",
function(){

button.dataset.lang;

"nh_lang",
lang
);

);

);

===================================================== */

document.addEventListener(
"touchmove",
function(event){

if(
state.running &&
event.target.closest("#arena")
){

event.preventDefault();

}

},
{
passive:false
}
);

===================================================== */
