<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>NUMBER HUNTER</title>

<style>

:root{
--blue:#2864c7;
--blue2:#3d73dc;
--purple:#8552df;
--gold:#e8a51a;
--navy:#234d80;
--red:#e5484d;
--bg:#f4f7fd;
--card:#fff;
--text:#17335f;
--muted:#71809a;
--border:#dce5f2;
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:var(--bg);
font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
color:var(--text);
}

button{
font:inherit;
touch-action:manipulation;
-webkit-user-select:none;
user-select:none;
}

#app{
position:fixed;
left:0;
top:0;
width:100%;
height:var(--vh,100dvh);
overflow:hidden;
}

.screen{
position:absolute;
inset:0;
display:none;
overflow:auto;
overscroll-behavior:contain;
padding:
calc(env(safe-area-inset-top,0px) + 18px)
18px
calc(env(safe-area-inset-bottom,0px) + 110px);
}

.screen.active{
display:block;
}


/* =========================
   HOME
========================= */

.home-wrap,
.choice-wrap{
width:min(700px,100%);
margin:auto;
}

.hero{
position:relative;
overflow:hidden;
text-align:center;

background:linear-gradient(145deg,#fff,#f7f3ff);

border:1px solid var(--border);
border-radius:36px;

padding:30px 22px;

box-shadow:
0 12px 35px rgba(40,100,199,.12);

margin-bottom:18px;
}

.hero:before,
.hero:after{
content:"";
position:absolute;
border-radius:50%;
pointer-events:none;
}

.hero:before{
width:220px;
height:220px;
left:-120px;
bottom:-110px;
background:rgba(61,115,220,.08);
}

.hero:after{
width:200px;
height:200px;
right:-100px;
top:-110px;
background:rgba(133,82,223,.08);
}

.logo{
width:118px;
height:118px;
margin:0 auto 18px;

border-radius:32px;

background:linear-gradient(
145deg,
#3175dc,
#1f58bd
);

display:grid;
place-items:center;

color:white;
font-size:34px;
font-weight:950;

box-shadow:
0 18px 38px rgba(40,100,199,.25);

position:relative;
z-index:2;
}

.hero h1{
margin:0;

font-size:clamp(42px,11vw,66px);

line-height:.98;

letter-spacing:-2px;

font-weight:950;

color:#285dad;

position:relative;
z-index:2;
}

.hero p{
margin:20px 0 10px;

font-size:21px;

color:#6e7a91;

font-weight:800;

position:relative;
z-index:2;
}

.primes{
font-size:28px;
font-weight:950;
color:var(--purple);
letter-spacing:2px;
position:relative;
z-index:2;
}

.stats-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:18px;
}

.stat{
background:#fff;
border:1px solid var(--border);
border-radius:25px;
padding:15px 8px;
text-align:center;
box-shadow:0 12px 35px rgba(40,100,199,.12);
}

.stat b{
display:block;
font-size:32px;
line-height:1;
color:var(--blue);
}

.stat span{
display:block;
margin-top:7px;
font-size:14px;
color:var(--muted);
font-weight:800;
}

.modes{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

.mode{
border:0;
border-radius:30px;
padding:22px 18px;
min-height:150px;

text-align:right;
color:#fff;

box-shadow:0 15px 30px rgba(40,100,199,.18);

cursor:pointer;
}

.mode:active{
transform:scale(.985);
}

.mode.blue{
background:linear-gradient(145deg,#3475dc,#2860c4);
}

.mode.purple{
background:linear-gradient(145deg,#9657e8,#7843d4);
}

.mode.gold{
background:linear-gradient(145deg,#f0b331,#d99513);
}

.mode.navy{
background:linear-gradient(145deg,#315b91,#183e70);
}

.mode .ico{
display:block;
font-size:42px;
margin-bottom:7px;
}

.mode h3{
margin:0 0 5px;
font-size:24px;
}

.mode p{
margin:0;
font-size:14px;
opacity:.92;
}

.secondary{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px;
margin-top:14px;
}

.secondary button{
min-height:82px;

border:1px solid var(--border);
background:#fff;

border-radius:26px;

color:var(--text);

font-size:18px;
font-weight:900;

box-shadow:0 12px 35px rgba(40,100,199,.12);

cursor:pointer;
}

.lang-row{
display:flex;
justify-content:center;
gap:8px;
margin-top:16px;
flex-wrap:wrap;
}

.lang{
border:1px solid var(--border);
background:#fff;
border-radius:16px;
padding:9px 14px;
color:var(--text);
font-weight:900;
cursor:pointer;
}

.lang.active{
background:var(--blue);
color:#fff;
}


/* =========================
   CHOICE
========================= */

.choice-screen{
padding-top:
calc(env(safe-area-inset-top,0px) + 22px);
}

.back{
border:1px solid var(--border);
background:#fff;
color:var(--text);
padding:11px 18px;
border-radius:17px;
font-weight:950;
cursor:pointer;
}

.choice-title{
text-align:center;
font-size:31px;
margin:25px 0 8px;
}

.choice-sub{
text-align:center;
color:var(--muted);
margin:0 0 20px;
font-weight:700;
}

.mission-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.mission-card{
border:1px solid var(--border);
background:#fff;
border-radius:23px;
padding:18px;
text-align:right;
box-shadow:0 12px 35px rgba(40,100,199,.12);
cursor:pointer;
}

.mission-card b{
display:block;
font-size:20px;
}

.mission-card span{
display:block;
margin-top:6px;
font-size:13px;
color:var(--muted);
}


/* =========================
   GAME
========================= */

#gameScreen{
padding:0;
overflow:hidden;

background:
radial-gradient(
circle at 15% 20%,
rgba(61,115,220,.10),
transparent 28%
),
radial-gradient(
circle at 85% 70%,
rgba(133,82,223,.07),
transparent 30%
),
#f4f7fd;
}

.game-shell{
position:absolute;
inset:0;
width:100%;
height:100%;
overflow:hidden;
}


/* TOP */

.topbar{
position:absolute;
z-index:30;

top:calc(env(safe-area-inset-top,0px) + 8px);

left:10px;
right:10px;

display:grid;
grid-template-columns:1fr 1.15fr 1fr;

gap:8px;
}

.game-stat{
background:rgba(255,255,255,.97);

border:1px solid var(--border);

border-radius:25px;

min-height:70px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

box-shadow:
0 8px 22px rgba(40,100,199,.10);

font-weight:950;
}

.game-stat b{
font-size:27px;
color:var(--blue);
}

.game-stat span{
font-size:14px;
color:var(--muted);
}


/* LOGO */

.game-logo{
position:absolute;
z-index:20;

top:calc(env(safe-area-inset-top,0px) + 88px);

left:50%;
transform:translateX(-50%);

width:82px;
height:82px;

border-radius:25px;

background:linear-gradient(
145deg,
#3175dc,
#1f58bd
);

display:grid;
place-items:center;

color:#fff;

font-size:27px;
font-weight:950;

box-shadow:
0 15px 35px rgba(40,100,199,.25);
}


/* MISSION */

.mission-display{
position:absolute;
z-index:18;

left:14px;
right:14px;

top:calc(env(safe-area-inset-top,0px) + 178px);

min-height:68px;

background:rgba(255,255,255,.97);

border:1px solid var(--border);

border-radius:25px;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

padding:10px 16px;

font-size:20px;

font-weight:950;

color:var(--text);

box-shadow:
0 12px 35px rgba(40,100,199,.12);
}


/* TIMER + COMBO */

.timer,
.combo{
position:absolute;

z-index:25;

top:calc(env(safe-area-inset-top,0px) + 254px);

border-radius:17px;

padding:8px 12px;

font-weight:950;

box-shadow:
0 7px 20px rgba(40,100,199,.12);
}

.timer{
right:18px;
background:var(--purple);
color:white;
}

.combo{
left:18px;
background:#fff;
color:var(--blue);
border:1px solid var(--border);
}


/* =====================================================
   ARENA
===================================================== */

#arena{
position:absolute;

left:10px;
right:10px;

top:calc(env(safe-area-inset-top,0px) + 266px);

bottom:
calc(env(safe-area-inset-bottom,0px) + 84px);

overflow:hidden;

border:
1px solid rgba(40,100,199,.14);

border-radius:30px;

background:
rgba(255,255,255,.62);

box-shadow:
inset 0 0 50px
rgba(40,100,199,.04);

touch-action:none;

user-select:none;
-webkit-user-select:none;
}


/* NUMBERS */

.number{
position:absolute;

width:64px;
height:64px;

border-radius:50%;

border:5px solid #4d82d6;

background:#fff;

display:grid;
place-items:center;

color:#234f8f;

font-size:21px;

font-weight:950;

cursor:pointer;

touch-action:none;

user-select:none;
-webkit-user-select:none;

transform:
translate(-50%,0);

will-change:transform;

z-index:3;
}

.number:active{
transform:
translate(-50%,0)
scale(.90);
}

.number.hit{
animation:hit .14s ease;
}

@keyframes hit{

0%{
transform:
translate(-50%,0)
scale(1);
}

50%{
transform:
translate(-50%,0)
scale(1.18);
}

100%{
transform:
translate(-50%,0)
scale(.2);

opacity:0;
}

}


/* CONTROLS */

.controls{
position:absolute;

z-index:40;

left:12px;
right:12px;

bottom:
calc(env(safe-area-inset-bottom,0px) + 15px);

height:54px;

display:flex;

justify-content:space-between;

align-items:center;

pointer-events:none;
}

.controls button{
pointer-events:auto;

height:54px;

border-radius:19px;

border:1px solid var(--border);

box-shadow:
0 10px 24px rgba(40,100,199,.14);

font-weight:950;

cursor:pointer;
}

.exit-btn{
width:58px;

background:
linear-gradient(
145deg,
#315b91,
#183e70
);

color:white;

font-size:23px;
}

.bomb-btn{
min-width:116px;

padding:0 15px;

background:#fff;

color:var(--text);

font-size:16px;
}

.bomb-btn:disabled{
opacity:.45;
}


/* OVERLAY */

.overlay,
.modal{
position:fixed;
inset:0;

z-index:500;

background:
rgba(13,26,47,.52);

display:none;

align-items:center;
justify-content:center;

padding:24px;
}

.overlay.show,
.modal.show{
display:flex;
}

.dialog,
.modal-card{
width:min(430px,100%);

background:#fff;

border-radius:30px;

padding:28px 22px;

text-align:center;

box-shadow:
0 25px 60px rgba(10,25,50,.3);
}

.dialog .big,
.modal-icon{
font-size:55px;
}

.dialog h2,
.modal-title{
margin:8px 0;
font-size:30px;
}

.dialog p,
.modal-text{
color:var(--muted);
font-weight:700;
line-height:1.7;
}

.dialog-actions,
.modal-actions{
display:flex;
gap:10px;
}

.dialog button,
.modal-btn{
flex:1;
border:0;
border-radius:18px;
padding:14px;
font-weight:950;
cursor:pointer;
}

.primary{
background:var(--blue);
color:white;
}

.secondary-btn,
.secondary-modal{
background:#edf2fa;
color:var(--text);
}

.primary-modal{
background:var(--red);
color:white;
}


/* TOAST */

.toast{
position:fixed;

z-index:600;

left:50%;

bottom:
calc(env(safe-area-inset-bottom,0px) + 86px);

transform:
translate(-50%,15px);

width:min(
430px,
calc(100% - 40px)
);

padding:15px 18px;

border-radius:20px;

background:var(--blue);

color:white;

text-align:center;

font-weight:900;

opacity:0;

pointer-events:none;

transition:.25s;
}

.toast.show{
opacity:1;

transform:
translate(-50%,0);
}


/* MOBILE */

@media(max-width:500px){

.mode{
min-height:145px;
padding:19px 15px;
}

.mode h3{
font-size:22px;
}

.stats-grid{
gap:8px;
}

.stat{
border-radius:22px;
}

.mission-display{
font-size:18px;
}

.mission-grid{
grid-template-columns:1fr;
}

.number{
width:60px;
height:60px;
font-size:20px;
}

.game-stat{
min-height:68px;
}

.game-stat b{
font-size:25px;
}

}


/* SHORT SCREEN */

@media(max-height:700px){

.game-logo{
top:calc(
env(safe-area-inset-top,0px) + 78px
);

width:72px;
height:72px;
border-radius:22px;
}

.mission-display{
top:calc(
env(safe-area-inset-top,0px) + 150px
);

min-height:60px;
}

.timer,
.combo{
top:calc(
env(safe-area-inset-top,0px) + 220px
);
}

#arena{
top:calc(
env(safe-area-inset-top,0px) + 232px
);

bottom:
calc(
env(safe-area-inset-bottom,0px) + 84px
);
}

}

</style>
</head>

<body>

<div id="app">


<!-- ================= HOME ================= -->

howContent:

function randomInt(min,max){

return Math.floor(
Math.random()*
(max-min+1)
)+min;

}


/* =====================================================
   PRIME
===================================================== */

function isPrime(n){

if(n<2)
return false;

if(n===2)
return true;

if(n%2===0)
return false;

for(
let i=3;
i*i<=n;
i+=2
){

if(n%i===0)
return false;

}

return true;

}

let source;

if(id){

source=
missions.find(
m=>m.id===id
);

}else{

missions[
randomInt(
0,
missions.length-1
)
];

}


const m={
...source
};


if(m.id==="divisor"){

m.target=
randomInt(12,36);

}


if(
m.id==="greater" ||
m.id==="less"
){

m.target=
randomInt(25,55);

}


return m;

}

/* =====================================================
   MATHEMATICAL LOGIC
===================================================== */

function correctFor(n,m){

if(!m)
return false;


switch(m.id){

case"prime":

return isPrime(n);


case"nonprime":

return !isPrime(n);


case"even":

return n%2===0;


case"odd":

return n%2!==0;


case"multiple3":

return n%3===0;


case"multiple4":

return n%4===0;


case"multiple5":

return n%5===0;


case"square":

return Number.isInteger(
Math.sqrt(n)
);


case"divisor":

return m.target%n===0;


case"greater":

return n>m.target;


case"less":

return n<m.target;


default:

return false;

}

}

/* =====================================================
   SPEED + DENSITY
===================================================== */

function getSpawnConfig(){

const seconds=
state.elapsed/1000;


/*
السرعة تبدأ ببطء ثم ترتفع تدريجيًا.
*/

const speed=
Math.min(
118,

34+
seconds*1.25+
(state.level-1)*3.5
);


/*
الكثافة ترتفع تدريجيًا.
*/

const interval=
Math.max(
520,

1050-
seconds*7-
(state.level-1)*25
);


const count=
Math.min(
5,

2+
Math.floor(
seconds/25
)
);


return{
speed,
interval,
count
};

}


/* =====================================================
   SPAWN
===================================================== */

function spawnTarget(){

if(!state.running)
return;


const arena=
$("arena");

const w=
arena.clientWidth;

const h=
arena.clientHeight;


if(
w<120||
h<120
)
return;


const cfg=
getSpawnConfig();


const number=
randomInt(1,99);

const id=
++state.id;

const radius=32;

const x=
randomInt(
radius+2,
Math.max(
radius+3,
w-radius-2
)
);

const y=-70;


const el=
document.createElement("div");

el.className=
"number";

el.dataset.id=
id;

el.textContent=
number;

el.style.left=
x+"px";

el.style.top=
"0px";


arena.appendChild(el);


state.targets.set(
id,
{
id,
n:number,
x,
y,
speed:cfg.speed,
el
}
);

}


/* =====================================================
   SPAWN WAVE
===================================================== */

function spawnWave(){

if(!state.running)
return;


const cfg=
getSpawnConfig();


for(
let i=0;
i<cfg.count;
i++
){

setTimeout(
()=>{

if(state.running)
spawnTarget();

},
i*110
);

}


state.spawnTimer=
setTimeout(
spawnWave,
cfg.interval
);

}


/* =====================================================
   GAME LOOP
===================================================== */

function animate(now){

if(!state.running)
return;


if(!state.lastFrame)
state.lastFrame=now;


const dt=
Math.min(
0.04,
(now-state.lastFrame)/1000
);


state.lastFrame=
now;


state.elapsed=
(now-state.startTime)/1000;


const arena=
$("arena");

const height=
arena.clientHeight;


/*
المستوى يرتفع تدريجيًا.
*/

const newLevel=
Math.floor(
state.elapsed/8
)+1;


if(
newLevel!==state.level
){

state.level=
newLevel;

$("level").textContent=
state.level;

}


/*
تحريك الأرقام.
*/

for(
const [id,o]
of state.targets
){

o.y+=
o.speed*dt;


o.el.style.transform=
`
translate(-50%,${o.y}px)
`;


/*
إذا خرج الرقم من منطقة اللعب
يختفي فقط ولا يخسر اللاعب قلبًا.
*/

if(
o.y>
height+75
){

o.el.remove();

state.targets.delete(id);

}

}


/* QUICK */

if(
state.mode==="quick"
){

const left=
Math.max(
0,
60-state.elapsed
);

$("timer").textContent=
"⏱ "+
Math.ceil(left)+
" "+
t("seconds");


if(left<=0){

endGame("TIME_UP");

return;

}

}


/* RANDOM */

if(
state.mode==="random"
){

const remaining=
20-
(state.elapsed%20);


$("timer").textContent=
"🎲 "+
Math.ceil(remaining)+
" "+
t("seconds");


const bucket=
Math.floor(
state.elapsed/20
);


if(
bucket!==state.randomBucket
){

state.randomBucket=
bucket;


if(bucket>0){

nextRandomMission();

}

}

}


state.raf=
requestAnimationFrame(
animate
);

}


/* =====================================================
   RANDOM MISSION
===================================================== */

function nextRandomMission(){

const old=
state.mission?.id;

let newId;

do{

newId=
missions[
randomInt(
0,
missions.length-1
)
].id;

}
while(
missions.length>1 &&
newId===old
);


state.mission=
makeMission(newId);

updateMissionDisplay();

toast(
"🎲 "+
t("challengeNew")
);

}


/* =====================================================
   HIT
===================================================== */

function hitTarget(el){

if(
!state.running||
!el
)
return;


const id=
Number(
el.dataset.id
);


const obj=
state.targets.get(id);


/*
حماية من الضغط المزدوج على نفس الرقم.
*/

if(!obj)
return;


state.targets.delete(id);

el.classList.add("hit");


setTimeout(
()=>el.remove(),
150
);


const correct=
correctFor(
obj.n,
state.mission
);


if(correct){

/*
الإجابة الصحيحة:
+ نقاط
+ كومبو
*/

state.combo++;

state.bestComboRun=
Math.max(
state.bestComboRun,
state.combo
);


const points=
10+
Math.min(
30,
(state.combo-1)*2
);


state.score+=
points;


$("score").textContent=
state.score;

updateCombo();

sound("correct");


if(
state.combo>0 &&
state.combo%10===0
){

toast(
t("levelUp")
);

}

}else{

/*
الإجابة الخاطئة:
- قلب
- تصفير الكومبو
*/

state.hearts--;

state.combo=0;

updateHearts();

updateCombo();

sound("wrong");

toast(
t("wrong")
);


if(
state.hearts<=0
){

endGame(
"GAME_OVER"
);

}

}

}


/* =====================================================
   BOMB
===================================================== */

function clearTargets(){

for(
const obj
of state.targets.values()
){

obj.el.remove();

}

state.targets.clear();

}


function useBomb(){

if(
!state.running||
!state.bombReady
)
return;


/*
القنبلة:
تمسح جميع الأعداد الموجودة.
لا تضيف نقاطًا.
لا تخسر قلبًا.
*/

clearTargets();

sound("bomb");

state.bombReady=false;

$("bombBtn").disabled=
true;


let seconds=8;

$("bombText").textContent=
t("bombWait")+
" "+
seconds;


clearInterval(
state.bombCooldown
);


state.bombCooldown=
setInterval(
()=>{

seconds--;


if(seconds<=0){

clearInterval(
state.bombCooldown
);

state.bombReady=
true;

$("bombBtn").disabled=
false;

$("bombText").textContent=
t("bomb");

}else{

$("bombText").textContent=
t("bombWait")+
" "+
seconds;

}

},
1000
);

}


/* =====================================================
   SOUND
===================================================== */

function sound(type){

try{

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext)
return;


if(!window.nhAudio){

window.nhAudio=
new AudioContext();

}


const ctx=
window.nhAudio;


if(
ctx.state==="suspended"
){

ctx.resume();

}


const oscillator=
ctx.createOscillator();

const gain=
ctx.createGain();


oscillator.type=
type==="wrong"
?"sawtooth"
:"sine";


oscillator.frequency.value=
type==="correct"
?620
:type==="bomb"
?180
:150;


gain.gain.setValueAtTime(
.0001,
ctx.currentTime
);


gain.gain.exponentialRampToValueAtTime(
.08,
ctx.currentTime+.01
);


gain.gain.exponentialRampToValueAtTime(
.0001,
ctx.currentTime+.13
);


oscillator.connect(gain);

gain.connect(
ctx.destination
);


oscillator.start();

oscillator.stop(
ctx.currentTime+.14
);

}catch(e){}

}

   START GAME
===================================================== */

mode,
mission

mission||

state.level=1;

state.startTime=
performance.now();

state.elapsed=0;

state.lastFrame=0;

state.id=0;

state.randomBucket=-1;

state.bombReady=true;


$("score").textContent=
"0";

$("level").textContent=
"1";


$("bombBtn").disabled=
false;

$("bombText").textContent=
t("bomb");


updateHearts();

updateCombo();

updateMissionDisplay();


$("gameOverOverlay")
.classList.remove(
"show"
);


$("timer").style.display=
(
mode==="quick"||
mode==="random"
)
?"block"
:"none";


if(mode==="quick"){

$("timer").textContent=
"⏱ 60 "+
t("seconds");

}


if(mode==="random"){

$("timer").textContent=
"🎲 20 "+
t("seconds");

}


clearTargets();


showScreen(
"gameScreen"
);


updateViewport();


/*
بداية هادئة.
*/

spawnTarget();

spawnTarget();


state.spawnTimer=
setTimeout(
spawnWave,
950
);


state.raf=
requestAnimationFrame(
animate
);

}


/* =====================================================
   STOP
===================================================== */

function stopGame(
count
){

state.running=false;


clearTimeout(
state.spawnTimer
);


cancelAnimationFrame(
state.raf
);


clearInterval(
state.bombCooldown
);


state.lastFrame=0;


clearTargets();


if(count){

stats.games++;


stats.bestScore=
Math.max(
stats.bestScore,
state.score
);


stats.bestCombo=
Math.max(
stats.bestCombo,
state.bestComboRun
);


saveStats();

updateStatsUI();

}

}


/* =====================================================
   GAME OVER
===================================================== */

function endGame(reason){

if(!state.running)
return;


stopGame(true);


if(reason==="TIME_UP"){

$("overIcon").textContent=
"⏱️";

$("overTitle").textContent=
t("timeUp");

}else{

$("overIcon").textContent=
"💔";

$("overTitle").textContent=
t("gameOver");

}


$("overText").textContent=
t("finalScore")+
": "+
state.score+
" • "+
t("finalCombo")+
": "+
state.bestComboRun;


$("gameOverOverlay")
.classList.add(
"show"
);

}


/* =====================================================
   EXIT
===================================================== */

function exitGame(){

stopGame(true);

$("gameOverOverlay")
.classList.remove(
"show"
);

showScreen(
"homeScreen"
);

applyLanguage();

}


/* =====================================================
   TOAST
===================================================== */

function toast(message){

const el=
$("toast");

el.textContent=
message;

el.classList.add(
"show"
);


clearTimeout(
window.nhToastTimer
);


window.nhToastTimer=
setTimeout(
()=>{
el.classList.remove(
"show"
);
},
1700
);

}


/* =====================================================
   NUMBER TOUCH
===================================================== */

/*
لا يتم اعتبار Scroll ضغطة.

فقط عندما يكون العنصر نفسه رقمًا
يتم تنفيذ hitTarget().
*/

$("arena")
.addEventListener(
"pointerdown",
function(event){

const number=
event.target.closest(
".number"
);


if(!number)
return;


event.preventDefault();

event.stopPropagation();


hitTarget(number);

},
{
passive:false
}
);
