<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>NUMBER HUNTER</title>

<style>
:root{
  --blue:#2864c7;
  --blue2:#3975dc;
  --purple:#8552df;
  --purple2:#9b5bea;
  --gold:#f2ae18;
  --green:#21a66f;
  --red:#e5484d;

  --bg:#f3f7ff;
  --card:#ffffff;
  --text:#173b68;
  --muted:#71809a;
  --border:#dce5f2;

  --shadow:0 12px 35px rgba(40,100,199,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background:
    radial-gradient(circle at 10% 20%,rgba(40,100,199,.08),transparent 28%),
    radial-gradient(circle at 90% 75%,rgba(133,82,223,.07),transparent 30%),
    var(--bg);

  color:var(--text);
}

body{
  overflow-x:hidden;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  min-height:100svh;
}

/* =========================================================
   LANGUAGE
========================================================= */

.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding:
    max(14px,env(safe-area-inset-top))
    18px
    10px;

  position:relative;
  z-index:20;
}

.lang-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);

  width:52px;
  height:44px;
  border-radius:15px;

  font-size:20px;
  font-weight:800;

  box-shadow:var(--shadow);
  cursor:pointer;
}

.lang-btn:active{
  transform:scale(.96);
}

.lang-btn.active{
  background:var(--blue);
  color:#fff;
}

/* =========================================================
   HOME
========================================================= */

#home{
  width:100%;
  min-height:100svh;

  padding:
    10px
    18px
    calc(35px + env(safe-area-inset-bottom));

  overflow-y:auto;
  overscroll-behavior-y:auto;
}

.hero{
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 100% 0%,rgba(133,82,223,.10),transparent 28%),
    radial-gradient(circle at 0% 100%,rgba(40,100,199,.10),transparent 30%),
    #fff;

  border:1px solid var(--border);
  border-radius:40px;

  padding:42px 20px 34px;

  text-align:center;

  box-shadow:var(--shadow);
}

.hero::before,
.hero::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.hero::before{
  width:220px;
  height:220px;
  right:-120px;
  top:-120px;
  background:rgba(133,82,223,.08);
}

.hero::after{
  width:230px;
  height:230px;
  left:-140px;
  bottom:-150px;
  background:rgba(40,100,199,.08);
}

.logo{
  width:128px;
  height:128px;

  margin:0 auto 28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:35px;

  background:
    linear-gradient(145deg,var(--blue2),var(--blue));

  color:#fff;

  font-size:47px;
  font-weight:900;

  box-shadow:
    0 18px 40px rgba(40,100,199,.28);

  position:relative;
  z-index:2;
}

.game-title{
  margin:0;

  color:var(--blue);
  font-size:clamp(42px,11vw,70px);
  line-height:.98;
  font-weight:950;
  letter-spacing:-2px;
  position:relative;
  z-index:2;
}

.game-subtitle{
  margin:26px 0 0;
  color:var(--muted);
  font-size:22px;
  font-weight:700;
  position:relative;
  z-index:2;
}

.prime-row{
  margin-top:38px;
  color:var(--purple);
  font-size:25px;
  font-weight:900;
  direction:ltr;
  position:relative;
  z-index:2;
}

/* =========================================================
   STATS
========================================================= */

.home-stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:20px 0;
}

.stat-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:28px;
  padding:18px 8px;

  text-align:center;
  box-shadow:var(--shadow);
}

.stat-value{
  font-size:38px;
  font-weight:950;
  color:var(--blue);
  line-height:1;
}

.stat-label{
  margin-top:10px;
  color:var(--muted);
  font-size:16px;
  font-weight:750;
}

/* =========================================================
   HOME BUTTONS
========================================================= */

.menu-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.menu-btn{
  min-height:185px;

  border:0;
  border-radius:34px;

  padding:20px;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  text-align:center;

  font-family:inherit;
  cursor:pointer;

  box-shadow:var(--shadow);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.menu-btn:active{
  transform:scale(.97);
}

.menu-icon{
  font-size:47px;
  margin-bottom:10px;
}

.menu-title{
  font-size:26px;
  font-weight:900;
}

.menu-desc{
  margin-top:8px;
  font-size:15px;
  font-weight:650;
  opacity:.9;
}

.blue-btn{
  background:linear-gradient(145deg,#3678df,#2864c7);
  color:#fff;
}

.purple-btn{
  background:linear-gradient(145deg,#9655e8,#7b43d4);
  color:#fff;
}

.gold-btn{
  background:linear-gradient(145deg,#f4b321,#df9910);
  color:#fff;
}

.dark-btn{
  background:linear-gradient(145deg,#315f96,#234d82);
  color:#fff;
}

.white-btn{
  background:#fff;
  color:var(--text);
  border:1px solid var(--border);
}

.home-extra{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:14px;
}

.small-menu{
  min-height:105px;
  border:1px solid var(--border);
  border-radius:28px;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:21px;
  font-weight:850;
  cursor:pointer;
  box-shadow:var(--shadow);
}

.small-menu:active{
  transform:scale(.98);
}

.home-footer-space{
  height:35px;
}

/* =========================================================
   GAME SCREEN
========================================================= */

#gameScreen{
  width:100%;
  min-height:100svh;

  display:flex;
  flex-direction:column;

  padding:
    max(12px,env(safe-area-inset-top))
    16px
    calc(28px + env(safe-area-inset-bottom));

  overflow:hidden;
}

/*
   مهم جداً:
   لا نستخدم height ثابت لمنطقة الأرقام.
   flex:1 يجعلها تأخذ فقط المساحة المتبقية.
*/
.game-layout{
  width:100%;
  flex:1;
  min-height:0;

  display:flex;
  flex-direction:column;
}

/* =========================================================
   GAME HEADER
========================================================= */

.game-stats{
  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  gap:10px;
  flex:0 0 auto;
}

.game-stat{
  min-height:104px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:30px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  box-shadow:var(--shadow);
}

.game-stat-value{
  font-size:38px;
  font-weight:950;
  color:var(--blue);
  line-height:1;
}

.game-stat-label{
  margin-top:8px;
  color:var(--muted);
  font-size:16px;
  font-weight:800;
}

.hearts{
  direction:ltr;
  font-size:40px;
  line-height:1;
  white-space:nowrap;
}

/* =========================================================
   MISSION TITLE
========================================================= */

.mission-box{
  flex:0 0 auto;

  margin-top:12px;

  min-height:86px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:12px 18px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:30px;

  box-shadow:var(--shadow);

  font-size:clamp(22px,6vw,31px);
  font-weight:950;
  color:var(--text);
}

.mission-box .target{
  margin-inline-start:8px;
}

/* =========================================================
   GAME INFO
========================================================= */

.game-info{
  flex:0 0 auto;

  display:flex;
  justify-content:space-between;
  align-items:center;

  gap:10px;

  margin:10px 0;
}

.combo{
  min-width:125px;
  padding:13px 18px;

  background:#fff;
  border:1px solid var(--border);
  border-radius:25px;

  text-align:center;

  font-size:19px;
  font-weight:900;

  box-shadow:var(--shadow);
}

.timer{
  min-width:125px;
  padding:13px 18px;

  background:var(--purple);
  color:#fff;

  border-radius:25px;

  text-align:center;

  font-size:19px;
  font-weight:900;

  box-shadow:0 10px 25px rgba(133,82,223,.25);
}

/* =========================================================
   ARENA
========================================================= */

.arena-wrap{
  flex:1;
  min-height:240px;

  position:relative;

  border:2px solid #dce6f3;
  border-radius:32px;

  background:
    radial-gradient(circle at 20% 25%,rgba(40,100,199,.035),transparent 25%),
    radial-gradient(circle at 80% 75%,rgba(133,82,223,.035),transparent 25%),
    rgba(255,255,255,.55);

  overflow:hidden;

  touch-action:pan-y;
  isolation:isolate;
}

.arena{
  position:absolute;
  inset:0;
  overflow:hidden;
}

/* =========================================================
   TARGETS
========================================================= */

.number{
  position:absolute;

  width:74px;
  height:74px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.96);

  border:6px solid var(--blue);

  color:var(--text);

  font-size:27px;
  font-weight:950;

  box-shadow:
    0 7px 18px rgba(40,100,199,.13);

  user-select:none;
  -webkit-user-select:none;

  cursor:pointer;

  /*
     مهم:
     الرقم نفسه يستجيب للـclick فقط.
     لا نستعمل pointerdown حتى لا يتحول
     السحب إلى ضغطة.
  */
  touch-action:manipulation;

  z-index:5;

  transition:
    transform .12s ease,
    opacity .12s ease;
}

.number:active{
  transform:scale(.9);
}

.number.good{
  animation:goodHit .2s ease forwards;
}

.number.bad{
  animation:badHit .2s ease forwards;
}

@keyframes goodHit{
  to{
    transform:scale(1.45);
    opacity:0;
  }
}

@keyframes badHit{
  0%{transform:translateX(0);}
  35%{transform:translateX(-8px);}
  70%{transform:translateX(8px);}
  100%{transform:scale(.8);opacity:0;}
}

/* =========================================================
   FEEDBACK
========================================================= */

.feedback{
  position:absolute;
  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  font-size:35px;
  font-weight:950;

  pointer-events:none;

  z-index:20;

  animation:feedback .65s ease forwards;
}

@keyframes feedback{
  0%{
    opacity:0;
    transform:translate(-50%,-40%) scale(.7);
  }

  20%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:translate(-50%,-100%) scale(1.2);
  }
}

/* =========================================================
   CONTROLS
========================================================= */

.game-controls{
  flex:0 0 auto;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:12px;

  margin-top:12px;
}

.control-btn{
  min-height:72px;

  border:0;
  border-radius:28px;

  font-family:inherit;
  font-size:22px;
  font-weight:950;

  cursor:pointer;

  box-shadow:var(--shadow);

  touch-action:manipulation;
}

.control-btn:active{
  transform:scale(.97);
}

.bomb-btn{
  background:linear-gradient(145deg,#f4b321,#df9910);
  color:#fff;
}

.exit-btn{
  background:linear-gradient(145deg,#315f96,#234d82);
  color:#fff;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;

  background:rgba(10,28,50,.60);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  z-index:100;
}

.modal.hidden{
  display:none;
}

.modal-card{
  width:min(500px,100%);

  max-height:calc(100svh - 40px);

  overflow:auto;

  background:#fff;

  border-radius:35px;

  padding:30px 22px;

  text-align:center;

  box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modal-title{
  margin:0 0 12px;
  font-size:32px;
  color:var(--blue);
  font-weight:950;
}

.modal-text{
  color:var(--muted);
  font-size:18px;
  line-height:1.8;
  font-weight:650;
}

.modal-actions{
  display:grid;
  gap:10px;
  margin-top:20px;
}

.modal-btn{
  min-height:58px;
  border:0;
  border-radius:20px;
  font-family:inherit;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
}

.modal-primary{
  background:var(--blue);
  color:#fff;
}

.modal-secondary{
  background:#eef3fb;
  color:var(--text);
}

/* =========================================================
   MISSION SELECTOR
========================================================= */

.mission-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.mission-choice{
  min-height:78px;

  border:2px solid var(--border);
  background:#fff;

  border-radius:22px;

  color:var(--text);

  font-family:inherit;

  font-size:17px;
  font-weight:850;

  cursor:pointer;
}

.mission-choice:active{
  transform:scale(.97);
}

.mission-choice.selected{
  background:#eef4ff;
  border-color:var(--blue);
  color:var(--blue);
}

/* =========================================================
   GAME OVER
========================================================= */

.game-over-score{
  font-size:55px;
  font-weight:950;
  color:var(--purple);
  margin:12px 0;
}

/* =========================================================
   STATS MODAL
========================================================= */

.stats-big{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

.stats-big div{
  background:#f5f8fd;
  border-radius:22px;
  padding:16px;
}

.stats-big strong{
  display:block;
  color:var(--blue);
  font-size:30px;
}

.stats-big span{
  color:var(--muted);
  font-weight:750;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

  #home{
    padding-left:14px;
    padding-right:14px;
  }

  .hero{
    padding-top:30px;
  }

  .logo{
    width:110px;
    height:110px;
    font-size:40px;
    margin-bottom:22px;
  }

  .game-title{
    font-size:46px;
  }

  .game-subtitle{
    font-size:19px;
  }

  .prime-row{
    font-size:22px;
  }

  .menu-btn{
    min-height:170px;
  }

  .menu-title{
    font-size:23px;
  }

  .menu-icon{
    font-size:42px;
  }

  .game-stat{
    min-height:92px;
  }

  .game-stat-value{
    font-size:34px;
  }

  .hearts{
    font-size:34px;
  }

  .number{
    width:70px;
    height:70px;
    font-size:25px;
  }
}

@media(max-width:360px){

  .menu-grid,
  .home-extra{
    grid-template-columns:1fr;
  }

  .game-stats{
    gap:6px;
  }

  .game-stat{
    border-radius:22px;
  }

  .game-stat-value{
    font-size:29px;
  }

  .game-stat-label{
    font-size:14px;
  }

  .hearts{
    font-size:29px;
  }
}

/*
  في الشاشات القصيرة:
  نخفض حجم بعض العناصر بدل أن نسمح للأزرار
  بالنزول خارج الشاشة.
*/
@media(max-height:700px){

  .game-stat{
    min-height:76px;
  }

  .game-stat-value{
    font-size:30px;
  }

  .game-stat-label{
    margin-top:4px;
    font-size:14px;
  }

  .hearts{
    font-size:29px;
  }

  .mission-box{
    min-height:68px;
    margin-top:8px;
  }

  .game-info{
    margin:7px 0;
  }

  .control-btn{
    min-height:62px;
  }
}
</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     HOME
===================================================== -->

<section id="home">

  <div class="topbar">
    <button class="lang-btn active" data-lang="ar">ع</button>
    <button class="lang-btn" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>

  <div class="hero">

    <div class="logo">√N</div>

    <h1 class="game-title" id="homeTitle">
      صائد الأعداد
    </h1>

    <div class="game-subtitle" id="homeSubtitle">
      رياضيات • سرعة • دقة
    </div>

    <div class="prime-row">
      2 • 3 • 5 • 7 • 11 • 13
    </div>

  </div>

  <div class="home-stats">

    <div class="stat-card">
      <div class="stat-value" id="bestScore">0</div>
      <div class="stat-label" id="bestScoreLabel">
        أفضل نتيجة
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-value" id="gamesPlayed">0</div>
      <div class="stat-label" id="gamesLabel">
        المباريات
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-value" id="bestCombo">0</div>
      <div class="stat-label" id="comboLabel">
        أفضل كومبو
      </div>
    </div>

  </div>

  <div class="menu-grid">

    <button
      class="menu-btn blue-btn"
      id="missionsBtn">

      <div class="menu-icon">🎯</div>

      <div
        class="menu-title"
        id="missionsTitle">
        المطاردة
      </div>

      <div
        class="menu-desc"
        id="missionsDesc">
        اختر المهمة الرياضية
      </div>

    </button>

    <button
      class="menu-btn purple-btn"
      id="quickBtn">

      <div class="menu-icon">⚡</div>

      <div
        class="menu-title"
        id="quickTitle">
        الصيد السريع
      </div>

      <div
        class="menu-desc"
        id="quickDesc">
        60 ثانية • حطم رقمك
      </div>

    </button>

    <button
      class="menu-btn gold-btn"
      id="randomBtn">

      <div class="menu-icon">🎲</div>

      <div
        class="menu-title"
        id="randomTitle">
        التحدي العشوائي
      </div>

      <div
        class="menu-desc"
        id="randomDesc">
        مهمة جديدة كل 20 ثانية
      </div>

    </button>

    <button
      class="menu-btn dark-btn"
      id="survivalBtn">

      <div class="menu-icon">❤️</div>

      <div
        class="menu-title"
        id="survivalTitle">
        البقاء
      </div>

      <div
        class="menu-desc"
        id="survivalDesc">
        3 قلوب • لا تخطئ
      </div>

    </button>

  </div>

  <div class="home-extra">

    <button
      class="small-menu"
      id="statsBtn">
      📊 إعادة الإحصائيات
    </button>

    <button
      class="small-menu"
      id="howBtn">
      ℹ️ طريقة اللعب
    </button>

  </div>

  <div class="home-footer-space"></div>

</section>


<!-- =====================================================
     GAME
===================================================== -->

<section id="gameScreen" style="display:none">

  <div class="game-layout">

    <div class="game-stats">

      <div class="game-stat">

        <div
          class="game-stat-value"
          id="levelValue">
          1
        </div>

        <div
          class="game-stat-label"
          id="levelLabel">
          المستوى
        </div>

      </div>

      <div class="game-stat">

        <div
          class="hearts"
          id="heartsValue">
          ❤️❤️❤️
        </div>

        <div
          class="game-stat-label"
          id="heartsLabel">
          القلوب
        </div>

      </div>

      <div class="game-stat">

        <div
          class="game-stat-value"
          id="scoreValue">
          0
        </div>

        <div
          class="game-stat-label"
          id="scoreLabel">
          النقاط
        </div>

      </div>

    </div>


    <div
      class="mission-box"
      id="missionBox">

      <span
        class="target">
        🎯
      </span>

      <span id="missionText">
        الأعداد الأولية
      </span>

    </div>


    <div class="game-info">

      <div
        class="combo"
        id="comboValue">
        🔥 0×
      </div>

      <div
        class="timer"
        id="timerValue">
        ⏱ 60
      </div>

/* =========================================================
   NUMBER LOGIC
========================================================= */

function isPrime(n){

  if(n < 2) return false;

  if(n === 2) return true;

  if(n % 2 === 0) return false;

  for(
    let i=3;
    i*i<=n;
    i+=2
  ){
    if(n%i===0)
      return false;
  }

  return true;
}

function isPerfectSquare(n){

  const r =
    Math.floor(Math.sqrt(n));

  return r*r === n;
}

function isDivisor(n,target){

  return target % n === 0;
}


/* =========================================================
   MISSION FACTORY
========================================================= */

const missions = [

  {
    id:"prime",
    label:"prime",
    test:n=>isPrime(n)
  },

  {
    id:"nonPrime",
    label:"nonPrime",
    test:n=>n >= 2 && !isPrime(n)
  },

  {
    id:"even",
    label:"even",
    test:n=>n%2===0
  },

  {
    id:"odd",
    label:"odd",
    test:n=>n%2!==0
  },

  {
    id:"mult3",
    label:"mult3",
    test:n=>n%3===0
  },

  {
    id:"mult4",
    label:"mult4",
    test:n=>n%4===0
  },

  {
    id:"mult5",
    label:"mult5",
    test:n=>n%5===0
  },

  {
    id:"square",
    label:"square",
    test:n=>isPerfectSquare(n)
  }
];

function createDynamicMission(){

  const type =
    Math.floor(
      Math.random()*2
    );

  if(type === 0){

    const target =
      [20,30,40,50,60,70][
        Math.floor(Math.random()*6)
      ];

    return {
      id:"less_"+target,
      textKey:"less",
      target,
      test:n=>n < target
    };
  }

  const target =
    [20,30,40,50,60,70][
      Math.floor(Math.random()*6)
    ];

  return {
    id:"greater_"+target,
    textKey:"greater",
    target,
    test:n=>n > target
  };
}

function createDivisorMission(){

  const target =
    [12,18,20,24,30,36,40,48,50,60][
      Math.floor(Math.random()*10)
    ];

  return {
    id:"divisor_"+target,
    textKey:"divisor",
    target,
    test:n=>n > 0 && isDivisor(n,target)
  };
}

function getMissionById(id){

  if(id === "dynamic")
    return createDynamicMission();

  if(id === "divisor")
    return createDivisorMission();

  const found =
    missions.find(
      m=>m.id===id
    );

  return found || missions[0];
}

function missionText(m){

  if(m.textKey === "less"){
    return "🎯 " + tr("less") + " " + m.target;
  }

  if(m.textKey === "greater"){
    return "🎯 " + tr("greater") + " " + m.target;
  }

  if(m.textKey === "divisor"){
    return "🎯 " + tr("divisor") + " " + m.target;
  }

  return "🎯 " + tr(m.label);
}

/* =========================================================
   GAME LOOP
========================================================= */

function startGameLoop(){

  let previous =
    performance.now();

  function loop(now){

    if(!game.active)
      return;

    const dt =
      Math.min(
        50,
        now-previous
      );

    previous = now;

    updateGame(dt);

    game.animationId =
      requestAnimationFrame(loop);
  }

  game.animationId =
    requestAnimationFrame(loop);
}

function stopGameLoop(){

  if(game.animationId){

    cancelAnimationFrame(
      game.animationId
    );

    game.animationId = null;
  }
}


/* =========================================================
   UPDATE
========================================================= */

function updateGame(dt){

  const seconds =
    dt / 1000;

  game.elapsed += seconds;

  /*
    السرعة:
    تبدأ بطيئة جداً
    ثم ترتفع تدريجياً.
  */

  game.speed =
    Math.min(
      .115,
      .028 +
      game.elapsed * .00085 +
      (game.level-1)*.004
    );

  /*
    الكثافة:
    نزيد عدد الأرقام تدريجياً
    دون إغراق الشاشة.
  */

  const spawnInterval =
    Math.max(
      650,
      1250 -
      game.elapsed*5 -
      (game.level-1)*60
    );

  game.spawnAccumulator += dt;

  if(
    game.spawnAccumulator >=
    spawnInterval
  ){

    game.spawnAccumulator = 0;

    const amount =
      game.elapsed > 45
      ? 2
      : 1;

    for(
      let i=0;
      i<amount;
      i++
    ){
      spawnTarget();
    }
  }

  moveTargets(dt);

  /*
    Quick Hunt = 60 ثانية.
  */

  if(game.mode === "quick"){

    game.timeLeft =
      Math.max(
        0,
        60 -
        Math.floor(game.elapsed)
      );

    if(game.timeLeft <= 0){

      endGame();

      return;
    }
  }

  /*
    Random Challenge:
    المهمة تتغير كل 20 ثانية.
  */

  if(game.mode === "random"){

    game.randomTimer =
      Math.max(
        0,
        20 -
        Math.floor(
          game.elapsed %
          20
        )
      );

    if(
      game.elapsed > 0 &&
      Math.floor(game.elapsed) % 20 === 0 &&
      Math.floor(game.elapsed) !==
      Math.floor(game.elapsed-seconds)
    ){

      changeRandomMission();
    }
  }

  /*
    المستوى يرتفع تدريجياً.
  */

  const newLevel =
    1 +
    Math.floor(
      game.score / 10
    );

  if(newLevel !== game.level){

    game.level =
      newLevel;

    updateGameUI();
  }

  updateGameUI();
}


/* =========================================================
   RANDOM MISSION
========================================================= */

function changeRandomMission(){

  const pool = [
    ...missions,
    {
      id:"divisor",
      textKey:"divisor",
      target:24,
      test:n=>n>0 && 24%n===0
    },
    createDynamicMission()
  ];

  let next =
    pool[
      Math.floor(
        Math.random()*pool.length
      )
    ];

  /*
    منع تكرار المهمة مباشرة.
  */

  let tries = 0;

  while(
    game.selectedMission &&
    next.id === game.selectedMission.id &&
    tries < 10
  ){

    next =
      pool[
        Math.floor(
          Math.random()*pool.length
        )
      ];

    tries++;
  }

  game.selectedMission = next;

  /*
    لا نحذف الأرقام القديمة.
    لكن الأرقام الجديدة تعتمد على المهمة الجديدة.
  */

  showFeedback(
    tr("randomChange"),
    "gold"
  );

  updateGameUI();
}


/* =========================================================
   SPAWN TARGET
========================================================= */

function spawnTarget(){

  if(!game.active)
    return;

  const rect =
    arena.getBoundingClientRect();

  if(
    rect.width < 100 ||
    rect.height < 100
  )
    return;

  const size =
    window.innerWidth <= 380
    ? 70
    : 74;

  /*
    نضمن دائماً وجود مساحة.
  */

  const maxX =
    Math.max(
      5,
      rect.width-size-5
    );

  const maxY =
    Math.max(
      5,
      rect.height-size-5
    );

  const x =
    5 +
    Math.random()*maxX;

  /*
    يبدأ الرقم من الأعلى قليلاً.
  */

  const y =
    -size -
    Math.random()*30;

  let value;

  /*
    45% تقريباً من الأرقام صحيحة.
    هذا يجعل اللاعب يحتاج إلى التركيز.
  */

  const shouldBeCorrect =
    Math.random() < .45;

  if(shouldBeCorrect){

    value =
      generateCorrectNumber();

  }else{

    value =
      generateWrongNumber();
  }

  const id =
    ++game.targetId;

  const el =
    document.createElement("button");

  el.type = "button";

  el.className = "number";

  el.textContent = value;

  el.style.left =
    x + "px";

  el.style.top =
    y + "px";

  /*
    click فقط:
    الضغط = لعب
    scroll = لا شيء
  */

  el.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      handleTargetClick(id);
    }
  );

  arena.appendChild(el);

  game.targets.set(
    id,
    {
      id,
      el,
      value,
      x,
      y,
      size,
      speed:
        game.speed *
        (0.85 + Math.random()*.3)
    }
  );
}


/* =========================================================
   GENERATE CORRECT
========================================================= */

function generateCorrectNumber(){

  const mission =
    game.selectedMission;

  if(!mission)
    return 2;

  let value;

  for(
    let i=0;
    i<200;
    i++
  ){

    value =
      2 +
      Math.floor(
        Math.random()*99
      );

    if(
      mission.test(value)
    ){
      return value;
    }
  }

  /*
    fallback آمن
  */

  if(mission.id === "prime")
    return [2,3,5,7,11,13][
      Math.floor(Math.random()*6)
    ];

  if(mission.id === "even")
    return 2 *
      (1+Math.floor(Math.random()*40));

  if(mission.id === "odd")
    return 2 *
      Math.floor(Math.random()*40)+1;

  if(mission.id === "mult3")
    return 3 *
      (1+Math.floor(Math.random()*30));

  if(mission.id === "mult4")
    return 4 *
      (1+Math.floor(Math.random()*20));

  if(mission.id === "mult5")
    return 5 *
      (1+Math.floor(Math.random()*19));

  if(mission.textKey === "less")
    return Math.max(
      2,
      Math.floor(
        mission.target*.5
      )
    );

  if(mission.textKey === "greater")
    return Math.min(
      99,
      mission.target+10
    );

  if(mission.textKey === "divisor"){

    const divisors = [];

    for(
      let n=1;
      n<=mission.target;
      n++
    ){

      if(
        mission.target%n===0
      ){
        divisors.push(n);
      }
    }

    return divisors[
      Math.floor(
        Math.random()*divisors.length
      )
    ];
  }

  if(mission.id === "square")
    return [4,9,16,25,36,49,64,81][
      Math.floor(Math.random()*8)
    ];

  return 2;
}


/* =========================================================
   GENERATE WRONG
========================================================= */

function generateWrongNumber(){

  const mission =
    game.selectedMission;

  let value;

  for(
    let i=0;
    i<200;
    i++
  ){

    value =
      2 +
      Math.floor(
        Math.random()*99
      );

    if(
      !mission.test(value)
    ){
      return value;
    }
  }

  /*
    fallback
  */

  if(
    mission.id === "prime"
  )
    return 4;

  if(
    mission.id === "even"
  )
    return 3;

  if(
    mission.id === "odd"
  )
    return 4;

  if(
    mission.id === "mult3"
  )
    return 10;

  if(
    mission.id === "mult4"
  )
    return 10;

  if(
    mission.id === "mult5"
  )
    return 12;

  return 1;
}


/* =========================================================
   MOVE TARGETS
========================================================= */

function moveTargets(dt){

  const rect =
    arena.getBoundingClientRect();

  const height =
    rect.height;

  for(
    const [id,t]
    of game.targets
  ){

    t.y +=
      t.speed *
      dt;

    t.el.style.transform =
      `translate3d(0,${t.y}px,0)`;

    /*
      إذا خرج من أسفل المنطقة:
      نحذفه فقط.
      لا يعتبر خطأ.
      لا نخسر قلباً.
    */

    if(
      t.y >
      height + t.size
    ){

      t.el.remove();

      game.targets.delete(id);
    }
  }
}


/* =========================================================
   TARGET CLICK
========================================================= */

function handleTargetClick(id){

  if(!game.active)
    return;

  const t =
    game.targets.get(id);

  /*
    حماية مهمة جداً:
    لا يوجد target = لا شيء.
  */

  if(!t)
    return;

  const correct =
    game.selectedMission
      .test(t.value);

  if(correct){

    handleCorrect(t);

  }else{

    handleWrong(t);
  }
}


/* =========================================================
   CORRECT
========================================================= */

function handleCorrect(t){

  if(!game.targets.has(t.id))
    return;

  game.targets.delete(t.id);

  t.el.classList.add("good");

  setTimeout(
    ()=>{
      t.el.remove();
    },
    180
  );

  /*
    النقاط:
    نقطة أساسية
    + bonus للكومبو
  */

  game.combo++;

  const points =
    1 +
    Math.floor(
      game.combo/5
    );

  game.score += points;

  playSound("correct");

  showFeedback(
    "+" + points,
    "good"
  );

  updateGameUI();
}


/* =========================================================
   WRONG
========================================================= */

function handleWrong(t){

  if(!game.targets.has(t.id))
    return;

  game.targets.delete(t.id);

  t.el.classList.add("bad");

  setTimeout(
    ()=>{
      t.el.remove();
    },
    200
  );

  game.combo = 0;

  /*
    الخطأ = قلب واحد فقط.
  */

  game.hearts =
    Math.max(
      0,
      game.hearts-1
    );

  playSound("wrong");

  showFeedback(
    tr("wrong"),
    "bad"
  );

  updateGameUI();

  /*
    عند 0 قلوب:
    Game Over مباشرة.
  */

  if(game.hearts <= 0){

    setTimeout(
      endGame,
      250
    );
  }
}


/* =========================================================
   BOMB
========================================================= */

function useBomb(){

  if(!game.active)
    return;

  if(!game.bombAvailable)
    return;

  game.bombAvailable = false;

  /*
    القنبلة لا تخصم قلباً.
    تمسح جميع الأرقام الظاهرة.
  */

  for(
    const [id,t]
    of game.targets
  ){

    t.el.classList.add("good");

    setTimeout(
      ()=>{
        t.el.remove();
      },
      160
    );

    game.targets.delete(id);
  }

  playSound("bomb");

  showFeedback(
    tr("bombUsed"),
    "gold"
  );

  updateGameUI();
}


/* =========================================================
   FEEDBACK
========================================================= */

function showFeedback(text,type){

  const old =
    arena.querySelector(".feedback");

  if(old)
    old.remove();

  const el =
    document.createElement("div");

  el.className =
    "feedback";

  el.textContent =
    text;

  if(type === "good")
    el.style.color =
      "var(--green)";

  else if(type === "bad")
    el.style.color =
      "var(--red)";

  else
    el.style.color =
      "var(--gold)";

  arena.appendChild(el);

  setTimeout(
    ()=>{
      el.remove();
    },
    650
  );
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

  if(!game.active)
    return;

  game.active = false;

  stopGameLoop();

  /*
    نحذف الأرقام.
  */

  for(
    const t
    of game.targets.values()
  ){

    t.el.remove();
  }

  game.targets.clear();

  saveStats();

  playSound("gameover");

  showGameOver();
}

/* =========================================================
   EXIT
========================================================= */

function exitGame(){

  if(!game.active)
    return;

  /*
    خروج مباشر.
    لا نخزن المباراة كأنها انتهت.
  */

  game.active = false;

  stopGameLoop();

  for(

    of game.targets.values()

  game.targets.clear();

  showHome();
}

/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function getAudio(){

  if(!audioContext){

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx)
      return null;

    audioContext =
      new AudioCtx();
  }

  if(
    audioContext.state ===
    "suspended"
  ){

    audioContext.resume()
      .catch(()=>{});
  }

  return audioContext;
}

function playSound(type){

  const ctx =
    getAudio();

  if(!ctx)
    return;

  const osc =
    ctx.createOscillator();

  const gain =
    ctx.createGain();

  osc.connect(gain);
  gain.connect(
    ctx.destination
  );

  let frequency = 500;
  let duration = .09;

  if(type === "correct"){
    frequency = 720;
    duration = .08;
  }

  if(type === "wrong"){
    frequency = 180;
    duration = .16;
  }

  if(type === "bomb"){
    frequency = 100;
    duration = .25;
  }

  if(type === "gameover"){
    frequency = 130;
    duration = .4;
  }

  osc.frequency.value =
    frequency;

  osc.type =
    type === "bomb"
    ? "sawtooth"
    : "sine";

  gain.gain.setValueAtTime(
    .001,
    ctx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .12,
    ctx.currentTime+.01
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    ctx.currentTime+duration
  );

  osc.start();

  osc.stop(
    ctx.currentTime+duration
  );
}
