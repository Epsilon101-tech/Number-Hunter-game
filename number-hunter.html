<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>صائد الأرقام</title>

<style>
:root{
  --blue:#2864c7;
  --blue2:#3d73dc;
  --blue-dark:#214b8d;
  --purple:#8552df;
  --purple2:#9a63ef;
  --cyan:#27c9d1;
  --gold:#f4b942;
  --green:#21a66f;
  --red:#e5484d;

  --bg:#f4f7fd;
  --card:#ffffff;
  --text:#17335f;
  --muted:#71809a;
  --border:#dce5f2;

  --shadow:
    0 12px 35px rgba(40,100,199,.12);

  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 20%,
      rgba(61,115,220,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 90% 80%,
      rgba(133,82,223,.09),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);
}

body{
  overflow-x:hidden;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  touch-action:manipulation;
}

button:focus{
  outline:none;
}

.hidden{
  display:none !important;
}

/* =========================================================
   APP
========================================================= */

#app{
  width:100%;
  min-height:100dvh;
  position:relative;
}

.screen{
  width:100%;
  min-height:100dvh;
}

/* =========================================================
   HOME
========================================================= */

#homeScreen{
  padding:
    calc(var(--safe-top) + 18px)
    18px
    calc(var(--safe-bottom) + 34px);

  overflow-y:auto;
}

.home-wrap{
  width:min(100%,680px);
  margin:0 auto;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:54px;
  height:54px;
  border-radius:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:23px;
  font-weight:900;

  background:
    linear-gradient(
      145deg,
      #3b7de4,
      #2259b9
    );

  box-shadow:
    0 10px 24px rgba(40,100,199,.24);
}

.brand-name{
  font-size:21px;
  font-weight:900;
  color:var(--text);
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:50px;
  height:50px;
  border-radius:17px;

  background:rgba(255,255,255,.92);
  border:1px solid var(--border);
  color:var(--text);

  font-size:22px;

  box-shadow:0 5px 18px rgba(40,100,199,.08);
}

.icon-btn:active{
  transform:scale(.95);
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;

  padding:38px 22px 32px;
  margin-bottom:18px;

  text-align:center;

  border-radius:34px;

  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #ffffff 48%,
      #faf7ff 100%
    );

  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

.hero:before,
.hero:after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
}

.hero:before{
  width:230px;
  height:230px;
  left:-125px;
  bottom:-135px;
  background:rgba(61,115,220,.09);
}

.hero:after{
  width:190px;
  height:190px;
  right:-100px;
  top:-110px;
  background:rgba(133,82,223,.08);
}

.hero-logo{
  position:relative;
  z-index:1;

  width:120px;
  height:120px;
  margin:0 auto 22px;

  border-radius:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:35px;
  font-weight:900;

  background:
    linear-gradient(
      145deg,
      #3479df,
      #2258b8
    );

  box-shadow:
    0 18px 35px rgba(40,100,199,.24);
}

.logo-title{
  position:relative;
  z-index:1;

  margin:0;

  font-size:clamp(38px,10vw,66px);
  line-height:.98;
  letter-spacing:-2px;

  color:var(--blue);
  font-weight:950;
}

.logo-subtitle{
  position:relative;
  z-index:1;

  margin:20px 0 0;

  font-size:20px;
  font-weight:700;
  color:var(--muted);
}

.math-line{
  position:relative;
  z-index:1;

  margin-top:25px;

  color:var(--purple);

  font-size:28px;
  font-weight:900;
  letter-spacing:4px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;

  margin-bottom:18px;
}

.stat-card{
  min-height:105px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:rgba(255,255,255,.96);

  border:1px solid var(--border);
  border-radius:27px;

  box-shadow:0 7px 22px rgba(40,100,199,.08);
}

.stat-value{
  font-size:34px;
  font-weight:950;
  color:var(--blue);
  line-height:1;
}

.stat-label{
  margin-top:9px;
  color:var(--muted);
  font-size:15px;
  font-weight:800;
}

/* MODES */

.mode-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.mode-card{
  min-height:190px;

  padding:20px 16px;

  border-radius:31px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  border:1px solid rgba(255,255,255,.7);

  box-shadow:
    0 14px 32px rgba(40,100,199,.12);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.mode-card:active{
  transform:scale(.97);
}

.mode-icon{
  font-size:42px;
  margin-bottom:10px;
}

.mode-title{
  font-size:23px;
  font-weight:950;
  margin-bottom:7px;
}

.mode-description{
  font-size:14px;
  font-weight:700;
  opacity:.82;
}

.mode-hunt{
  color:white;
  background:
    linear-gradient(
      145deg,
      #3479df,
      #2864c7
    );
}

.mode-quick{
  color:white;
  background:
    linear-gradient(
      145deg,
      #9b55e8,
      #7950d7
    );
}

.mode-random{
  color:white;
  background:
    linear-gradient(
      145deg,
      #efb52e,
      #df9c19
    );
}

.mode-survival{
  color:white;
  background:
    linear-gradient(
      145deg,
      #315e9b,
      #21497f
    );
}

/* HOME SECONDARY */

.secondary-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:12px;
}

.secondary-btn{
  min-height:85px;

  padding:15px;

  border-radius:26px;

  background:white;
  color:var(--text);

  border:1px solid var(--border);

  font-size:18px;
  font-weight:900;

  box-shadow:
    0 8px 24px rgba(40,100,199,.08);
}

.secondary-btn:active{
  transform:scale(.97);
}

.reset-note{
  margin-top:14px;
  padding:16px 18px;

  border-radius:22px;

  background:rgba(255,255,255,.75);
  border:1px solid var(--border);

  text-align:center;

  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

/* =========================================================
   GAME
========================================================= */

#gameScreen{
  position:fixed;
  inset:0;

  width:100vw;
  height:100dvh;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 15% 25%,
      rgba(61,115,220,.13),
      transparent 27%
    ),
    radial-gradient(
      circle at 85% 75%,
      rgba(133,82,223,.10),
      transparent 28%
    ),
    var(--bg);

  z-index:1000;
}

.game-shell{
  position:relative;

  width:100%;
  height:100%;

  overflow:hidden;
}

/* GAME TOP STATS */

.game-stats{
  position:absolute;

  top:calc(var(--safe-top) + 14px);
  left:18px;
  right:18px;

  height:92px;

  display:grid;
  grid-template-columns:1fr 1.25fr 1fr;
  gap:10px;

  z-index:50;
}

.game-stat{
  min-width:0;

  border-radius:28px;

  background:rgba(255,255,255,.96);
  border:1px solid var(--border);

  box-shadow:
    0 8px 25px rgba(40,100,199,.09);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.game-stat-value{
  font-size:34px;
  font-weight:950;
  line-height:1;
  color:var(--blue);
}

.game-stat-label{
  margin-top:7px;
  font-size:14px;
  font-weight:800;
  color:var(--muted);
}

.hearts{
  font-size:29px;
  line-height:1;
  white-space:nowrap;
  letter-spacing:-2px;
}

/* MISSION */

.mission-box{
  position:absolute;

  top:calc(var(--safe-top) + 118px);
  left:20px;
  right:20px;

  min-height:78px;

  padding:15px 16px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  background:rgba(255,255,255,.97);

  border:1px solid var(--border);
  border-radius:27px;

  box-shadow:
    0 9px 28px rgba(40,100,199,.10);

  color:var(--text);

  font-size:24px;
  font-weight:950;

  z-index:50;
}

.mission-inner{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

.mission-icon{
  font-size:27px;
}

/* GAME INFO */

.game-info{
  position:absolute;

  top:calc(var(--safe-top) + 207px);
  left:25px;
  right:25px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  z-index:50;

  pointer-events:none;
}

.combo{
  min-width:108px;

  padding:9px 15px;

  border-radius:24px;

  background:rgba(255,255,255,.95);
  border:1px solid var(--border);

  color:var(--blue);

  font-size:18px;
  font-weight:950;

  text-align:center;
}

.timer{
  min-width:108px;

  padding:10px 16px;

  border-radius:25px;

  background:var(--purple);

  color:white;

  font-size:18px;
  font-weight:950;

  text-align:center;

  box-shadow:
    0 8px 20px rgba(133,82,223,.22);
}

/* ARENA */

#arena{
  position:absolute;

  top:calc(var(--safe-top) + 260px);

  left:18px;
  right:18px;

  bottom:
    calc(
      var(--safe-bottom) + 104px
    );

  overflow:hidden;

  border-radius:31px;

  background:
    radial-gradient(
      circle at 20% 25%,
      rgba(61,115,220,.045),
      transparent 35%
    ),
    radial-gradient(
      circle at 80% 75%,
      rgba(133,82,223,.045),
      transparent 35%
    ),
    rgba(255,255,255,.38);

  border:2px solid rgba(220,229,242,.85);

  box-shadow:
    inset 0 0 40px rgba(40,100,199,.035);

  z-index:10;
}

/* TARGET */

.target{
  position:absolute;

  width:clamp(58px,16vw,76px);
  height:clamp(58px,16vw,76px);

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 35% 30%,
      #ffffff,
      #f9fbff 62%,
      #edf3fc 100%
    );

  border:
    6px solid var(--blue);

  color:var(--text);

  font-size:clamp(20px,5.7vw,30px);
  font-weight:950;

  box-shadow:
    0 8px 24px rgba(40,100,199,.12);

  user-select:none;
  -webkit-user-select:none;

  will-change:transform;

  z-index:20;

  cursor:pointer;

  touch-action:manipulation;

  animation:
    targetAppear .18s ease-out;
}

.target.correct-hint{
  border-color:var(--green);
}

.target:active{
  transform:scale(.90);
}

@keyframes targetAppear{
  from{
    opacity:0;
    transform:scale(.55);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.target.hit-good{
  animation:goodHit .22s ease-out forwards;
}

.target.hit-bad{
  animation:badHit .22s ease-out forwards;
}

@keyframes goodHit{
  to{
    opacity:0;
    transform:scale(1.5);
  }
}

@keyframes badHit{
  30%{
    transform:translateX(-7px);
  }
  60%{
    transform:translateX(7px);
  }
  100%{
    opacity:0;
    transform:scale(.65);
  }
}

/* FALLING TARGET */
.target.falling{
  transition:none;
}

/* POWER / EXIT */

.game-controls{
  position:absolute;

  left:22px;
  right:22px;

  bottom:
    calc(
      var(--safe-bottom) + 17px
    );

  height:70px;

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

  z-index:60;
}

.game-btn{
  height:70px;

  border-radius:27px;

  font-size:19px;
  font-weight:950;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  box-shadow:
    0 10px 25px rgba(40,100,199,.12);

  border:1px solid rgba(255,255,255,.65);
}

.game-btn:active{
  transform:scale(.97);
}

.bomb-btn{
  color:white;

  background:
    linear-gradient(
      145deg,
      #f4b62f,
      #df9d18
    );
}

.exit-btn{
  color:white;

  background:
    linear-gradient(
      145deg,
      #315f9d,
      #214b85
    );
}

/* =========================================================
   OVERLAY / MODALS
========================================================= */

.overlay{
  position:fixed;
  inset:0;

  z-index:5000;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:
    calc(var(--safe-top) + 20px)
    20px
    calc(var(--safe-bottom) + 20px);

  background:rgba(15,29,53,.58);

  backdrop-filter:blur(8px);
}

.modal{
  width:min(100%,430px);

  padding:28px 22px;

  border-radius:32px;

  background:white;

  border:1px solid var(--border);

  box-shadow:
    0 25px 70px rgba(20,50,100,.24);

  text-align:center;
}

.modal-icon{
  font-size:52px;
  margin-bottom:8px;
}

.modal-title{
  margin:0 0 10px;

  font-size:30px;
  font-weight:950;

  color:var(--text);
}

.modal-text{
  margin:0 0 22px;

  color:var(--muted);

  font-size:16px;
  font-weight:700;

  line-height:1.7;
}

.modal-buttons{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.modal-btn{
  min-height:56px;

  border-radius:20px;

  font-size:17px;
  font-weight:950;
}

.modal-primary{
  background:var(--blue);
  color:white;
}

.modal-secondary{
  background:#edf3fc;
  color:var(--text);
}

/* =========================================================
   TOAST / FEEDBACK
========================================================= */

#feedback{
  position:fixed;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  opacity:0;

  z-index:8000;

  pointer-events:none;

  padding:12px 22px;

  border-radius:24px;

  font-size:24px;
  font-weight:950;

  background:white;

  box-shadow:
    0 14px 40px rgba(20,50,100,.20);

  transition:
    opacity .16s ease,
    transform .16s ease;
}

#feedback.show{
  opacity:1;
  transform:
    translate(-50%,-50%)
    scale(1);
}

#feedback.good{
  color:var(--green);
}

#feedback.bad{
  color:var(--red);
}

/* =========================================================
   LANGUAGE
========================================================= */

.lang-list{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.lang-option{
  min-height:58px;

  border-radius:20px;

  background:#f4f7fd;
  color:var(--text);

  font-weight:900;
}

.lang-option.active{
  background:var(--blue);
  color:white;
}

/* =========================================================
   HOW TO PLAY
========================================================= */

.rules{
  text-align:right;
}

[dir="ltr"] .rules{
  text-align:left;
}

.rule{
  padding:13px 0;

  border-bottom:1px solid #e8edf5;

  font-size:15px;
  font-weight:700;

  line-height:1.7;
}

.rule:last-child{
  border-bottom:0;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:430px){

  #homeScreen{
    padding-left:14px;
    padding-right:14px;
  }

  .hero{
    padding-top:28px;
    border-radius:30px;
  }

  .hero-logo{
    width:105px;
    height:105px;
    border-radius:29px;
  }

  .logo-title{
    font-size:43px;
  }

  .logo-subtitle{
    font-size:17px;
  }

  .math-line{
    font-size:23px;
  }

  .stat-card{
    min-height:92px;
    border-radius:23px;
  }

  .stat-value{
    font-size:29px;
  }

  .stat-label{
    font-size:13px;
  }

  .mode-card{
    min-height:170px;
    border-radius:27px;
  }

  .mode-icon{
    font-size:37px;
  }

  .mode-title{
    font-size:20px;
  }

  .mode-description{
    font-size:12px;
  }

  .game-stats{
    left:12px;
    right:12px;
    gap:7px;
  }

  .game-stat{
    border-radius:23px;
  }

  .game-stat-value{
    font-size:30px;
  }

  .hearts{
    font-size:24px;
  }

  .game-stat-label{
    font-size:12px;
  }

  .mission-box{
    left:14px;
    right:14px;
    top:calc(var(--safe-top) + 112px);
    min-height:74px;
    font-size:20px;
    border-radius:25px;
  }

  .game-info{
    top:calc(var(--safe-top) + 196px);
    left:20px;
    right:20px;
  }

  .combo,
  .timer{
    min-width:92px;
    padding:8px 11px;
    font-size:16px;
  }

  #arena{
    top:calc(var(--safe-top) + 245px);

    left:12px;
    right:12px;

    bottom:
      calc(
        var(--safe-bottom) + 98px
      );

    border-radius:27px;
  }

  .game-controls{
    left:14px;
    right:14px;

    bottom:
      calc(
        var(--safe-bottom) + 12px
      );

    height:66px;
  }

  .game-btn{
    height:66px;
    border-radius:24px;
    font-size:17px;
  }
}

@media(max-height:700px){

  .game-stats{
    height:80px;
  }

  .game-stat-value{
    font-size:27px;
  }

  .mission-box{
    top:calc(var(--safe-top) + 103px);
    min-height:68px;
  }

  .game-info{
    top:calc(var(--safe-top) + 180px);
  }

  #arena{
    top:calc(var(--safe-top) + 225px);
    bottom:
      calc(
        var(--safe-bottom) + 92px
      );
  }

  .game-controls{
    height:62px;
    bottom:
      calc(
        var(--safe-bottom) + 10px
      );
  }

  .game-btn{
    height:62px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- =====================================================
       HOME
  ====================================================== -->

  <section id="homeScreen" class="screen">

    <div class="home-wrap">

      <header class="topbar">

        <div class="brand">
          <div class="brand-mark">√N</div>
          <div class="brand-name" id="brandName">
            IA Math
          </div>
        </div>

        <div class="header-actions">

          <button
            class="icon-btn"
            id="languageBtn"
            type="button"
            aria-label="Language">
            文
          </button>

          <button
            class="icon-btn"
            id="infoBtn"
            type="button"
            aria-label="Information">
            ⓘ
          </button>

        </div>

      </header>

      <div class="hero">

        <div class="hero-logo">√N</div>

        <h1
          id="homeTitle"
          class="logo-title">
          NUMBER<br>HUNTER
        </h1>

        <p
          id="homeSubtitle"
          class="logo-subtitle">
          رياضيات • سرعة • دقة
        </p>

        <div class="math-line">
          13 · 11 · 7 · 5 · 3 · 2
        </div>

      </div>

      <div class="stats">

        <div class="stat-card">
          <div
            id="bestScore"
            class="stat-value">

}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [array[i],array[j]]=[array[j],array[i]];
