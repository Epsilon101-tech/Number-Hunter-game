<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<meta name="theme-color" content="#2864c7">

<title>NUMBER HUNTER</title>

<style>

:root{
--blue:#2864c7;
--blue2:#3d73dc;
--purple:#8552df;
--gold:#f4b942;
--green:#21a66f;
--red:#e5484d;

--bg:#f4f7fd;
--card:#ffffff;
--text:#17335f;
--muted:#71809a;
--border:#dce5f2;

--shadow:0 12px 35px rgba(40,100,199,.12);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{
margin:0;
padding:0;
width:100%;
min-height:100%;
background:var(--bg);
color:var(--text);
font-family:
system-ui,
-apple-system,
"Segoe UI",
Tahoma,
Arial,
sans-serif;
}

body{
overflow-x:hidden;
}

button{
font:inherit;
border:0;
cursor:pointer;
touch-action:manipulation;
}

button:active{
transform:scale(.97);
}

#app{
width:100%;
min-height:100dvh;
padding:
14px
16px
calc(60px + env(safe-area-inset-bottom));
}

.screen{
display:none;
width:100%;
max-width:720px;
margin:auto;
}

.screen.active{
display:block;
}

/* =========================
   HOME
========================= */

.hero{
position:relative;
overflow:hidden;

background:
linear-gradient(
135deg,
#ffffff 0%,
#f9fbff 55%,
#f7f2ff 100%
);

border:1px solid var(--border);
border-radius:38px;

padding:30px 18px 26px;

text-align:center;

box-shadow:var(--shadow);
}

.hero:before,
.hero:after{
content:"";
position:absolute;
border-radius:50%;
pointer-events:none;
}

.hero:before{
width:230px;
height:230px;
background:rgba(40,100,199,.07);
left:-110px;
bottom:-130px;
}

.hero:after{
width:230px;
height:230px;
background:rgba(133,82,223,.07);
right:-110px;
top:-130px;
}

.logo{
width:126px;
height:126px;

margin:0 auto 22px;

border-radius:34px;

display:grid;
place-items:center;

background:
linear-gradient(
145deg,
var(--blue2),
var(--blue)
);

color:white;

font-size:40px;
font-weight:950;

box-shadow:
0 16px 35px rgba(40,100,199,.25);

position:relative;
z-index:1;
}

.brand{
font-size:clamp(42px,10vw,68px);
line-height:.98;
font-weight:950;
letter-spacing:-2px;

margin:0;

color:#2859a7;

position:relative;
z-index:1;
}

.tagline{
font-size:21px;
font-weight:800;
color:var(--muted);

margin:22px 0 12px;

position:relative;
z-index:1;
}

.mathline{
font-size:28px;
font-weight:950;
color:#8050d4;

position:relative;
z-index:1;
}

/* =========================
   HOME STATS
========================= */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;

margin:16px 0;
}

.stat{
background:#fff;

border:1px solid var(--border);
border-radius:27px;

padding:13px 5px;

text-align:center;

box-shadow:
0 8px 22px rgba(40,100,199,.07);
}

.stat b{
display:block;
font-size:34px;
line-height:1.1;
color:var(--blue);
}

.stat span{
display:block;
font-size:14px;
font-weight:800;
color:var(--muted);
margin-top:6px;
}

/* =========================
   HOME BUTTONS
========================= */

.home-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.menu-btn{
min-height:140px;

border-radius:30px;

padding:18px 12px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

box-shadow:var(--shadow);

border:1px solid rgba(255,255,255,.7);
}

.menu-btn .ico{
font-size:37px;
line-height:1;
margin-bottom:10px;
}

.menu-btn strong{
font-size:23px;
font-weight:950;
}

.menu-btn small{
font-size:14px;
font-weight:700;
margin-top:7px;
opacity:.88;
}

.blue{
background:linear-gradient(145deg,#3978df,#2864c7);
color:#fff;
}

.purple{
background:linear-gradient(145deg,#9656e9,#7848d3);
color:#fff;
}

.gold{
background:linear-gradient(145deg,#f4b942,#e5a71c);
color:#fff;
}

.dark{
background:linear-gradient(145deg,#315e91,#234b79);
color:#fff;
}

.white{
background:#fff;
color:var(--text);
}

.full{
grid-column:1/-1;
min-height:78px;
}

/* =========================
   MISSION SELECTION
========================= */

.back-row{
display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:10px;
}

.back{
width:52px;
height:52px;

border-radius:18px;

background:#fff;
color:var(--blue);

border:1px solid var(--border);

font-size:27px;

box-shadow:
0 7px 20px rgba(40,100,199,.08);
}

.page-title{
text-align:center;

font-size:32px;
font-weight:950;

margin:8px 0 20px;
}

.choice-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.choice{
background:#fff;

border:2px solid var(--border);
border-radius:26px;

padding:20px 10px;

min-height:112px;

text-align:center;

color:var(--text);

box-shadow:
0 8px 22px rgba(40,100,199,.07);
}

.choice b{
display:block;
font-size:21px;
font-weight:950;
}

.choice small{
display:block;
color:var(--muted);
font-weight:700;
margin-top:7px;
}

/* =========================
   GAME HUD
========================= */

.hud{
display:grid;
grid-template-columns:1fr 1.25fr 1fr;
gap:8px;

margin-bottom:14px;
}

.hud-card{
background:#fff;

border:1px solid var(--border);
border-radius:27px;

min-height:105px;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;

box-shadow:var(--shadow);
}

.hud-card b{
font-size:36px;
line-height:1;

font-weight:950;
color:var(--blue);
}

.hud-card span{
font-size:15px;
font-weight:850;
color:var(--muted);

margin-top:8px;
}

.hearts{
font-size:31px;
white-space:nowrap;
letter-spacing:1px;
}

/*
  مهم:
  لا يوجد game-logo هنا.
  شعار √N لا يظهر داخل اللعبة.
*/

/* =========================
   MISSION TITLE
========================= */

.mission-title{
background:#fff;

border:1px solid var(--border);
border-radius:30px;

min-height:80px;

padding:10px 14px;

display:flex;
align-items:center;
justify-content:center;

text-align:center;

font-size:27px;
font-weight:950;

color:var(--text);

box-shadow:var(--shadow);

margin-bottom:9px;
}

/* =========================
   GAME INFO
========================= */

.game-info{
display:flex;
justify-content:space-between;
align-items:center;

gap:10px;

margin-bottom:9px;
}

.pill{
background:#fff;

border:1px solid var(--border);

border-radius:24px;

padding:10px 17px;

font-size:18px;
font-weight:950;

box-shadow:
0 7px 18px rgba(40,100,199,.08);
}

.timer{
background:var(--purple);

color:white;

border-radius:24px;

padding:10px 17px;

font-size:18px;
font-weight:950;

box-shadow:
0 8px 20px rgba(133,82,223,.22);
}

/* =========================
   GAME AREA
========================= */

.game-area{

position:relative;

width:100%;

/*
  ارتفاع متجاوب مع الهاتف
*/
height:clamp(
430px,
58dvh,
690px
);

min-height:430px;

overflow:hidden;

border:2px solid var(--border);

border-radius:32px;

background:

radial-gradient(
circle at 18% 18%,
rgba(40,100,199,.07),
transparent 30%
),

radial-gradient(
circle at 82% 80%,
rgba(133,82,223,.06),
transparent 32%
),

#fff;

box-shadow:
inset 0 0 35px rgba(40,100,199,.04),
0 8px 25px rgba(40,100,199,.06);

touch-action:none;
}

/* =========================
   TARGET NUMBERS
========================= */

.target{

position:absolute;

width:70px;
height:70px;

border-radius:50%;

display:grid;
place-items:center;

background:rgba(255,255,255,.97);

border:6px solid var(--blue);

color:#17335f;

font-size:25px;

font-weight:950;

box-shadow:
0 7px 18px rgba(40,100,199,.13);

user-select:none;

touch-action:none;

will-change:transform;
}

.target.hit{
animation:
hit .18s ease-out forwards;
}

@keyframes hit{

to{
transform:scale(1.45);
opacity:0;
}

}

/* =========================
   FEEDBACK
========================= */

.feedback{

position:absolute;

left:50%;
top:45%;

transform:
translate(-50%,-50%);

z-index:50;

font-size:30px;

font-weight:950;

pointer-events:none;

opacity:0;
}

.feedback.show{
animation:
feedback .55s ease-out;
}

@keyframes feedback{

0%{
opacity:0;
transform:
translate(-50%,-20%)
scale(.7);
}

25%{
opacity:1;
transform:
translate(-50%,-50%)
scale(1.1);
}

100%{
opacity:0;
transform:
translate(-50%,-100%)
scale(1);
}

}

/* =========================
   GAME CONTROLS
========================= */

.controls{

display:grid;

grid-template-columns:1fr 1fr;

gap:13px;

margin-top:13px;

padding-bottom:
calc(
18px +
env(safe-area-inset-bottom)
);
}

.control{

min-height:70px;

border-radius:28px;

font-size:21px;

font-weight:950;

color:#fff;

box-shadow:var(--shadow);
}

.bomb{
background:
linear-gradient(
145deg,
#f4b942,
#e3a319
);
}

.quit{
background:
linear-gradient(
145deg,
#315f91,
#234d7d
);
}

/* =========================
   MODAL
========================= */

.modal-wrap{

position:fixed;

inset:0;

background:
rgba(16,31,54,.52);

display:none;

align-items:center;
justify-content:center;

z-index:9999;

padding:20px;
}

.modal-wrap.show{
display:flex;
}

.modal{

width:min(560px,100%);

background:#fff;

border-radius:34px;

padding:28px 20px;

box-shadow:
0 25px 70px rgba(0,0,0,.22);

text-align:center;

max-height:88dvh;

overflow:auto;
}

.modal h2{
margin:0 0 12px;
font-size:31px;
}

.modal p{
font-size:18px;
font-weight:600;
color:var(--muted);
line-height:1.8;
}

.modal-actions{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

margin-top:18px;
}

.modal-btn{

min-height:58px;

border-radius:22px;

font-weight:900;
}

.primary{
background:var(--blue);
color:#fff;
}

.secondary{
background:#eef3fb;
color:var(--text);
}

/* =========================
   MOBILE
========================= */

@media(max-width:520px){

#app{
padding:
10px
12px
calc(
62px +
env(safe-area-inset-bottom)
);
}

.hero{
padding:25px 13px 22px;
border-radius:32px;
}

.logo{
width:110px;
height:110px;
border-radius:31px;
}

.brand{
font-size:47px;
}

.tagline{
font-size:19px;
}

.mathline{
font-size:24px;
}

.stats{
gap:7px;
}

.stat{
border-radius:23px;
}

.stat b{
font-size:31px;
}

.stat span{
font-size:13px;
}

.home-grid{
gap:11px;
}

.menu-btn{
min-height:130px;
border-radius:27px;
}

.menu-btn strong{
font-size:20px;
}

.menu-btn small{
font-size:13px;
}

.hud{
gap:7px;
}

.hud-card{
min-height:102px;
border-radius:24px;
}

.hud-card b{
font-size:33px;
}

.hud-card span{
font-size:14px;
}

.hearts{
font-size:28px;
}

.mission-title{
font-size:24px;
min-height:77px;
border-radius:27px;
}

.game-area{
height:clamp(
430px,
56dvh,
620px
);

min-height:430px;

border-radius:28px;
}

.target{
width:68px;
height:68px;
font-size:24px;
border-width:5px;
}

.control{
min-height:68px;
font-size:20px;
border-radius:25px;
}

}

@media(max-height:700px){

.game-area{
height:430px;
}

.hud-card{
min-height:88px;
}

}

</style>
</head>

<body>

<div id="app">

<!-- ==================================================
     HOME
================================================== -->

<section id="home" class="screen active">

<div class="hero">

<div class="logo">
√N
</div>

<h1 id="brand" class="brand">
NUMBER<br>HUNTER
</h1>

<div id="tagline" class="tagline">
رياضيات • سرعة • دقة
</div>

<div class="mathline">
13 • 11 • 7 • 5 • 3 • 2
</div>

</div>


<div class="stats">

<div class="stat">
<b id="bestScore">0</b>
<span id="bestLabel">أفضل نتيجة</span>
</div>

<div class="stat">
<b id="gamesPlayed">0</b>
<span id="gamesLabel">المباريات</span>
</div>

<div class="stat">

<span id="comboLabel">أفضل كومبو</span>
</div>

<div class="home-grid">

<button
id="missionBtn"
class="menu-btn blue">

اختر المهمة الرياضية

<button
id="quickBtn"

الصيد السريع

60 ثانية • حطم رقمك
</small>

<button
id="randomBtn"

<button

<button

<button

القواعد وطريقة اللعب
</small>

</button>


<button
id="languageBtn"

<div class="ico">🌐</div>

<strong id="languageBtnText">
اللغة

<small id="languageBtnSub">
العربية
</small>

</button>

</div>

</section>


<!-- ==================================================

================================================== -->

<section id="missions" class="screen">

<button
class="back"

</div>

id="missionsTitle"
class="page-title">
اختر المهمة

<div class="choice-grid">

class="choice"

<button

اضغط الأعداد الزوجية

<button

اضغط الأعداد الفردية

<button

⭕ الأعداد غير الأولية

قواسم العدد المعطى

<button

data-mission="square">

<button

data-mission="less">

الأعداد الأصغر من الهدف

<button
class="choice"

الأعداد الأكبر من الهدف

</div>

<!-- ==================================================
     GAME

<section
id="game"
class="screen">

0

</div>

</div>

</div>

خروج

     MODAL

/* ==================================================
   MATHEMATICS LOGIC
================================================== */

function isPrime(n){

if(n<2)
return false;

if(n===2)
return true;

if(n%2===0)
return false;

for(
let i=3;
i*i<=n;
i+=2
){

if(n%i===0)
return false;

}

return true;

}


function isSquare(n){

return Number.isInteger(
Math.sqrt(n)
);

}


function correctFor(n,m){

if(!m)
return false;

switch(m.type){

case "prime":
return isPrime(n);

case "even":
return n%2===0;

case "odd":
return n%2!==0;

case "nonPrime":
return !isPrime(n);

case "multiple":
return n%m.value===0;

case "divisor":
return m.value%n===0;

case "square":
return isSquare(n);

case "less":
return n<m.value;

case "greater":
return n>m.value;

default:
return false;

}

}


/* ==================================================
   MISSION TITLE
================================================== */

function missionTitle(m){

const x=L();

if(!m)
return "";

switch(m.type){

case "prime":
return `🎯 ${x.prime}`;

case "even":
return `🎯 ${x.even}`;

case "odd":
return `🎯 ${x.odd}`;

case "nonPrime":
return `🎯 ${x.nonPrime}`;

case "multiple":
return `🎯 ${x.multipleOf(m.value)}`;

case "divisor":
return `🎯 ${x.divisorsOf(m.value)}`;

case "square":
return `🎯 ${x.square}`;

case "less":
return `🎯 ${x.lessThan(m.value)}`;

case "greater":
return `🎯 ${x.greaterThan(m.value)}`;

default:
return "";

}

}

$("missionTitle").textContent=
missionTitle(currentMission);

   RANDOM MISSION
================================================== */

function randomMission(){

const types=[
"prime",
"even",
"odd",
"nonPrime",
"multiple",
"divisor",
"square",
"less",
"greater"
];

const type=
types[
Math.floor(
Math.random()*types.length
)
];

if(type==="multiple"){

return{
type,
value:
[3,4,5][
Math.floor(Math.random()*3)
]
};

}

if(type==="divisor"){

return{
type,
value:
Math.floor(
Math.random()*30
)+6
};

}

if(
type==="less"||
type==="greater"
){

return{
type,
value:
Math.floor(
Math.random()*45
)+30
};

}

return{type};

}

/* ==================================================
   SOUND
================================================== */

function beep(ok=true){

try{

audioCtx=
audioCtx||
new(
window.AudioContext||
window.webkitAudioContext
)();

if(
audioCtx.state==="suspended"
)
audioCtx.resume();

const o=
audioCtx.createOscillator();

const g=
audioCtx.createGain();

o.type="sine";

o.frequency.value=
ok?620:180;

g.gain.setValueAtTime(
.0001,
audioCtx.currentTime
);

g.gain.exponentialRampToValueAtTime(
.07,
audioCtx.currentTime+.01
);

g.gain.exponentialRampToValueAtTime(
.0001,
audioCtx.currentTime+
(ok?.13:.18)
);

o.connect(g);

g.connect(
audioCtx.destination
);

o.start();

o.stop(
audioCtx.currentTime+
(ok?.14:.19)
);

}
catch(e){}

}

/* ==================================================
   TARGETS
================================================== */

function clearTargets(){

targets.forEach(
t=>t.el.remove()
);

targets.clear();

}


function targetSize(){

return window.innerWidth<520?
68:
70;

}


function spawnTarget(){

if(!running)
return;

const area=$("gameArea");

const rect=
area.getBoundingClientRect();

const size=
targetSize();

const n=
Math.floor(
Math.random()*99
)+2;

const el=
document.createElement("div");

el.className="target";

el.textContent=n;

const id=nextId++;

el.dataset.id=id;

const x=
Math.random()*
Math.max(
1,
rect.width-size
);

const y=
-size-5;

el.style.left=
x+"px";

el.style.top=
"0px";

area.appendChild(el);

const t={
id,
n,
x,
y,
el
};

targets.set(id,t);


/*
  pointerdown فقط:
  لا click مزدوج،
  لا scroll،
  لا لمس عابر.
*/

el.addEventListener(
"pointerdown",
e=>{

e.preventDefault();
e.stopPropagation();

const obj=
targets.get(id);

if(obj)
hitTarget(obj);

},
{
passive:false
}
);

}


/* ==================================================
   HIT LOGIC
================================================== */

function hitTarget(t){

if(
!running||
!t||
!targets.has(t.id)
)
return;

const good=
correctFor(
t.n,
currentMission
);

targets.delete(t.id);

t.el.classList.add("hit");

setTimeout(
()=>t.el.remove(),
180
);


if(good){

/*
  صحيح:
  نقاط + كومبو
*/

combo++;

const points=
10+
Math.min(
40,
combo*2
)+
level*2;

score+=points;

if(
combo%8===0
)
level++;

showFeedback(
L().correct+points,
true
);

beep(true);

}

else{

/*
  خطأ:
  قلب ينقص
*/

combo=0;

hearts--;

showFeedback(
L().wrong,
false
);

beep(false);

if(hearts<=0){

updateHUD();

endGame("hearts");

return;

}

}

updateHUD();

}


/* ==================================================
   BOMB
================================================== */

function bomb(){

if(!running)
return;

const count=
targets.size;

if(!count)
return;

targets.forEach(
t=>t.el.remove()
);

targets.clear();

combo=0;

/*
  القنبلة لا تعتبر إجابة صحيحة
  ولا تنقص قلباً.
*/

showFeedback(
"💥",
true
);

beep(true);

updateHUD();

}


/* ==================================================
   PROGRESSIVE SPEED
================================================== */

function speed(){

const base=
mode==="survival"
?48
:45;

return(
base+
level*4+
elapsed*1.5
);

}


/* ==================================================
   PROGRESSIVE DENSITY
================================================== */

function density(){

const max=
mode==="quick"
?8
:
mode==="survival"
?7
:9;

return Math.min(
max,
3+
Math.floor(elapsed/18)+
Math.floor(level/3)
);

}


/* ==================================================
   GAME LOOP
================================================== */

function loop(now){

if(!running)
return;

const dt=
Math.min(
.05,
(now-lastTime)/1000||0
);

lastTime=now;

elapsed+=dt;

spawnAcc+=dt;


/*
  السرعة تبدأ بطيئة
  ثم تزيد تدريجياً.
*/

const interval=
Math.max(
.42,
1.15-
elapsed*.008-
level*.018
);


if(
spawnAcc>=interval &&
targets.size<density()
){

spawnAcc=0;

spawnTarget();

}


/*
  تحريك الأرقام
*/

const area=$("gameArea");

const rect=
area.getBoundingClientRect();

targets.forEach(t=>{

t.y+=
speed()*dt;

if(
t.y>
rect.height+90
){

t.el.remove();

targets.delete(t.id);

return;

}

t.el.style.transform=
`translate3d(0,${t.y}px,0)`;

});


/*
  Quick Hunt
*/

if(mode==="quick"){

timeLeft-=dt;

if(timeLeft<=0){

timeLeft=0;

updateHUD();

endGame("time");

return;

}

}


/*
  Random Challenge
  كل 20 ثانية بالضبط
*/

if(mode==="random"){

if(
elapsed>=randomChangeAt
){

randomChangeAt+=20;

currentMission=
randomMission();

clearTargets();

updateGameTitle();

showFeedback(
L().randomNew,
true
);

beep(true);

}

}

updateHUD();

raf=
requestAnimationFrame(loop);

}


/* ==================================================
   START GAME
================================================== */

function startGame(
newMode="mission",
mission=null
){

cancelAnimationFrame(raf);

clearTargets();

mode=newMode;

running=true;

score=0;

hearts=3;

combo=0;

level=1;

elapsed=0;

timeLeft=60;

randomChangeAt=20;

currentMission=
mission||
randomMission();

showScreen("game");

updateGameTitle();

updateHUD();

lastTime=
performance.now();

spawnAcc=0;


/*
  بداية اللعبة:
  عدد قليل من الأرقام.
*/

for(
let i=0;
i<3;
i++
){

setTimeout(
()=>{
if(running)
spawnTarget();
},
i*220
);

}

raf=
requestAnimationFrame(loop);

try{

audioCtx=
audioCtx||
new(
window.AudioContext||
window.webkitAudioContext
)();

audioCtx.resume();

}
catch(e){}

}


/* ==================================================
   END GAME
================================================== */

function endGame(reason){

if(!running)
return;

running=false;

cancelAnimationFrame(raf);

clearTargets();

saveStats();

updateHomeStats();

const title=
reason==="hearts"
?
L().gameOver
:
L().timeUp;

const text=
`${L().score}: ${score} • ${L().comboLabel}: ${combo}`;

openModal(
title,
text,
[
{
text:L().playAgain,
primary:true,
fn:()=>{

if(mode==="mission"){

startGame(
"mission",
currentMission
);

}

else if(mode==="random"){

startGame(
"random",
null
);

}

else{

startGame(
mode,
currentMission
);

}

}
},

{
text:L().home,
fn:()=>showScreen("home")
}

]
);

}


/* ==================================================
   QUIT
================================================== */

function quitGame(){

if(!running)
return;

openModal(
L().quit,
L().home+"?",
[
{
text:L().continue,
primary:true
},

{
text:L().home,

fn:()=>{

running=false;

cancelAnimationFrame(raf);

clearTargets();

showScreen("home");

}

}

]
);

}

/*
  إعادة الإحصائيات موجودة هنا فقط
  خارج اللعب.
*/

$("statsBtn")
.addEventListener(
"click",
()=>{

const x=L();

openModal(
x.statsTitle,
x.statsText,
[
{
text:x.cancel
},

{
text:x.confirm,
primary:true,

fn:()=>{

localStorage.removeItem(
"nh-best-score"
);

localStorage.removeItem(
"nh-games"
);

localStorage.removeItem(
"nh-best-combo"
);

updateHomeStats();

openModal(
x.statsDone,
x.statsDoneText,
[
{
text:x.home,
primary:true
}
]
);

}

}

]
);

}
);

);

/* ==================================================
   MISSION BUTTONS
================================================== */

document
.querySelectorAll("[data-mission]")
.forEach(
b=>
b.addEventListener(
"click",
()=>{

const type=
b.dataset.mission;

let m={type};


/*
  مضاعفات:
  نختار 3 أو 4 أو 5.
*/

if(type==="multiple"){

m.value=
[3,4,5][
Math.floor(
Math.random()*3
)
];

}


/*
  القواسم:
  عدد مناسب يمكن أن تكون له عدة قواسم.
*/

if(type==="divisor"){

m.value=
Math.floor(
Math.random()*30
)+6;

}


/*
  أكبر / أصغر
*/

if(
type==="less"||
type==="greater"
){

m.value=
Math.floor(
Math.random()*45
)+30;

}


startGame(
"mission",
m
);

}
)
);

================================================== */
