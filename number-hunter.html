<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NUMBER HUNTER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
body{font-family:Arial,Helvetica,sans-serif}
button{font:inherit}
#NH{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 20%,#17313a 0,#0d2028 35%,#05090d 100%);color:#fff}
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px}
.screen.active{display:flex}
.card{width:min(92vw,620px);max-height:94dvh;overflow:auto;border:2px solid #263743;border-radius:42px;
background:linear-gradient(160deg,#16232e,#0d1821);box-shadow:0 0 45px #000b;padding:34px 28px;text-align:center}
.logo{font-size:clamp(42px,11vw,76px);font-weight:900;line-height:.92;letter-spacing:1px;text-shadow:0 0 22px #61ffff66}
.logo span{color:#61f5ed}
.subtitle{font-size:clamp(18px,4.5vw,28px);font-weight:700;color:#62f3ed;margin:24px 0 36px}
.btn{width:min(100%,470px);min-height:72px;border:0;border-radius:45px;margin:9px auto;padding:12px 22px;
font-size:clamp(21px,5vw,30px);font-weight:800;cursor:pointer;color:#101820;background:#5be7df;
box-shadow:0 8px 25px #4de6df33;touch-action:manipulation}
.btn.secondary{background:#555861;color:#fff}.btn:active{transform:scale(.98)}
.scoreline{font-size:27px;font-weight:800;color:#62f3ed;margin:24px 0}
.lang-title{font-size:24px;color:#aab5bf;font-weight:700;margin:25px 0 12px}
.langs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.lang{width:auto;min-height:58px;margin:0;padding:10px 18px;font-size:19px;background:#182431;color:#dce3e8;
border:2px solid #455361;box-shadow:none}
.lang.selected{border-color:#61f5ed;color:#61f5ed}
.small{font-size:15px;color:#9ba7b0;line-height:1.6}
#gameScreen{padding:0;align-items:stretch}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:
radial-gradient(circle at 50% 35%,#132d36,#071018 70%);touch-action:none}
#hud{position:absolute;z-index:20;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
display:grid;grid-template-columns:1fr 1.7fr 1fr;gap:8px;align-items:center;background:#071018cc;backdrop-filter:blur(6px)}
.hudbox{text-align:center;font-weight:800;font-size:clamp(14px,3.8vw,22px)}
#mission{color:#61f5ed;font-size:clamp(15px,4vw,23px)}
#lives{color:#ff7584}
#arena{position:absolute;left:0;right:0;top:88px;bottom:0;overflow:hidden}
.target{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-weight:900;font-size:22px;color:#fff;background:linear-gradient(145deg,#253e4a,#12232d);border:2px solid #61f5ed;
box-shadow:0 0 18px #61f5ed55;user-select:none;cursor:pointer;touch-action:none}
.target.good{border-color:#69f6c8}.target.bad{border-color:#ff697c}
.power{position:absolute;width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;
font-size:28px;background:#202d39;border:2px solid #ffd866;box-shadow:0 0 18px #ffd86666;cursor:pointer;z-index:4}
#bottom{position:absolute;z-index:20;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
display:flex;gap:8px;width:calc(100% - 24px);justify-content:center}
.gamebtn{border:1px solid #53616d;background:#17232e;color:#fff;border-radius:18px;padding:10px 15px;font-weight:800;
font-size:15px;touch-action:manipulation}
#countdown{position:absolute;z-index:30;inset:0;display:none;align-items:center;justify-content:center;
font-size:110px;font-weight:900;color:#61f5ed;text-shadow:0 0 30px #61f5ed88;background:#0005}
#countdown.show{display:flex}
.result-title{font-size:42px;font-weight:900;color:#61f5ed}.result-score{font-size:34px;margin:22px 0}
.help{text-align:start;font-size:18px;line-height:1.65;color:#d5dde2}
.help h3{color:#61f5ed;margin-bottom:6px}
@media(max-height:650px){.card{padding:22px 18px;border-radius:30px}.subtitle{margin:15px 0 20px}.btn{min-height:58px}.logo{font-size:48px}}
</style>
</head>
<body>
<div id="NH">

<section id="home" class="screen active">
  <div class="card">
    <div class="logo">🔢 <span>NUMBER</span><br>HUNTER</div>
    <div class="subtitle" data-i18n="tagline">Think Fast. Catch the Right Numbers!</div>
    <button class="btn" id="playBtn" type="button">▶ <span data-i18n="play">PLAY</span></button>
    <button class="btn secondary" id="helpBtn" type="button">❓ <span data-i18n="help">HOW TO PLAY</span></button>
    <div class="scoreline">🏆 <span data-i18n="high">HIGH SCORE</span>: <span id="highScore">0</span></div>
    <div class="lang-title" data-i18n="language">Language</div>
    <div class="langs">
      <button class="btn lang" data-lang="ar" type="button">🇲🇦 العربية</button>
      <button class="btn lang" data-lang="fr" type="button">🇫🇷 Français</button>
      <button class="btn lang selected" data-lang="en" type="button">🇬🇧 English</button>
    </div>
  </div>
</section>

<section id="helpScreen" class="screen">
 <div class="card">
  <div class="result-title" data-i18n="howTitle">HOW TO PLAY</div>
  <div class="help" id="helpText"></div>
  <button class="btn secondary" id="backHelp" type="button">← <span data-i18n="back">BACK</span></button>
 </div>
</section>

<section id="modeScreen" class="screen">
 <div class="card">
  <div class="result-title" data-i18n="chooseMode">CHOOSE MODE</div>
  <button class="btn" id="missionMode" type="button">🎯 <span data-i18n="missions">MISSIONS</span></button>
  <button class="btn" id="quickMode" type="button">⚡ <span data-i18n="quick">QUICK HUNT</span></button>
  <button class="btn" id="survivalMode" type="button">❤️ <span data-i18n="survival">SURVIVAL</span></button>
  <button class="btn secondary" id="backMode" type="button">← <span data-i18n="back">BACK</span></button>
 </div>
</section>

<section id="gameScreen" class="screen">
 <div id="game">
  <div id="hud">
   <div class="hudbox">⭐ <span id="score">0</span></div>
   <div class="hudbox" id="mission">🎯</div>
   <div class="hudbox" id="lives">❤️❤️❤️</div>
  </div>
  <div id="arena"></div>
  <div id="countdown"></div>
  <div id="bottom">
   <button class="gamebtn" id="pauseBtn" type="button">⏸ <span data-i18n="pause">PAUSE</span></button>
   <button class="gamebtn" id="bombBtn" type="button">💣 <span data-i18n="bomb">BOMB</span></button>
   <button class="gamebtn" id="exitBtn" type="button">✕ <span data-i18n="exit">EXIT</span></button>
  </div>
 </div>
</section>

<section id="resultScreen" class="screen">
 <div class="card">
  <div class="result-title" id="resultTitle">GAME OVER</div>
  <div class="result-score">🏆 <span data-i18n="score">SCORE</span>: <b id="finalScore">0</b></div>
  <div class="scoreline">🔥 <span data-i18n="combo">BEST COMBO</span>: <span id="bestCombo">0</span></div>
  <button class="btn" id="againBtn" type="button">▶ <span data-i18n="again">PLAY AGAIN</span></button>
  <button class="btn secondary" id="homeBtn" type="button">⌂ <span data-i18n="home">HOME</span></button>
 </div>
</section>
</div>

<script>
(function(){
'use strict';

const $=id=>document.getElementById(id);
const screens={home:$('home'),help:$('helpScreen'),mode:$('modeScreen'),game:$('gameScreen'),result:$('resultScreen')};
const arena=$('arena');

const T={
en:{
tagline:'Think Fast. Catch the Right Numbers!',play:'PLAY',help:'HOW TO PLAY',high:'HIGH SCORE',language:'Language',
howTitle:'HOW TO PLAY',back:'BACK',chooseMode:'CHOOSE MODE',missions:'MISSIONS',quick:'QUICK HUNT',survival:'SURVIVAL',
pause:'PAUSE',resume:'RESUME',bomb:'BOMB',exit:'EXIT',score:'SCORE',combo:'BEST COMBO',again:'PLAY AGAIN',home:'HOME',
gameover:'GAME OVER',paused:'PAUSED',
mission:'Tap the numbers that are',prime:'PRIME NUMBERS',notPrime:'NOT PRIME',even:'EVEN NUMBERS',odd:'ODD NUMBERS',
mul3:'MULTIPLES OF 3',mul4:'MULTIPLES OF 4',mul5:'MULTIPLES OF 5',square:'PERFECT SQUARES',
greater:'GREATER THAN',less:'LESS THAN',quickMission:'Catch any number!',survivalMission:'Catch the target numbers!',
helpText:'<h3>🎯 Goal</h3>Tap numbers that match the mission. Avoid wrong numbers.<h3>⚡ Speed</h3>The game starts slowly and gets faster as time passes.<h3>🔥 Combo</h3>Correct hits in a row increase your combo and score.<h3>💣 Power-up</h3>Bomb clears the visible targets. More power-ups can appear during play.'
},
fr:{
tagline:'Réfléchis vite. Attrape les bons nombres !',play:'JOUER',help:'COMMENT JOUER',high:'MEILLEUR SCORE',language:'Langue',
howTitle:'COMMENT JOUER',back:'RETOUR',chooseMode:'CHOISIR LE MODE',missions:'MISSIONS',quick:'CHASSE RAPIDE',survival:'SURVIE',
pause:'PAUSE',resume:'REPRENDRE',bomb:'BOMBE',exit:'QUITTER',score:'SCORE',combo:'MEILLEUR COMBO',again:'REJOUER',home:'ACCUEIL',
gameover:'FIN DE PARTIE',paused:'PAUSE',
mission:'Appuie sur les nombres qui sont',prime:'NOMBRES PREMIERS',notPrime:'NON PREMIERS',even:'NOMBRES PAIRS',odd:'NOMBRES IMPAIRS',
mul3:'MULTIPLES DE 3',mul4:'MULTIPLES DE 4',mul5:'MULTIPLES DE 5',square:'CARRÉS PARFAITS',
greater:'SUPÉRIEURS À',less:'INFÉRIEURS À',quickMission:'Attrape n’importe quel nombre !',survivalMission:'Attrape les bons nombres !',
helpText:'<h3>🎯 But</h3>Appuie sur les nombres correspondant à la mission. Évite les mauvais nombres.<h3>⚡ Vitesse</h3>Le jeu commence lentement puis accélère progressivement.<h3>🔥 Combo</h3>Les bonnes réponses consécutives augmentent le combo et le score.<h3>💣 Bonus</h3>La bombe efface les nombres visibles.'
},
ar:{
tagline:'فكّر بسرعة والتقط الأعداد الصحيحة!',play:'ابدأ اللعب',help:'طريقة اللعب',high:'أعلى نتيجة',language:'اللغة',
howTitle:'طريقة اللعب',back:'رجوع',chooseMode:'اختر نمط اللعب',missions:'المهمات',quick:'الصيد السريع',survival:'البقاء',
pause:'إيقاف',resume:'متابعة',bomb:'قنبلة',exit:'خروج',score:'النتيجة',combo:'أفضل كومبو',again:'العب من جديد',home:'الرئيسية',
gameover:'انتهت اللعبة',paused:'متوقف',
mission:'اضغط على الأعداد التي هي',prime:'أعداد أولية',notPrime:'أعداد غير أولية',even:'أعداد زوجية',odd:'أعداد فردية',
mul3:'مضاعفات 3',mul4:'مضاعفات 4',mul5:'مضاعفات 5',square:'مربعات كاملة',
greater:'أكبر من',less:'أصغر من',quickMission:'التقط أي عدد!',survivalMission:'التقط الأعداد الصحيحة!',
helpText:'<h3>🎯 الهدف</h3>اضغط على الأعداد التي توافق المهمة وتجنب الأعداد الخاطئة.<h3>⚡ السرعة</h3>تبدأ اللعبة ببطء ثم تزداد السرعة تدريجيًا مع الوقت.<h3>🔥 الكومبو</h3>الإجابات الصحيحة المتتالية ترفع الكومبو والنقاط.<h3>💣 القنبلة</h3>القنبلة تمسح الأعداد الظاهرة.'
}
};

let lang=localStorage.getItem('nhLang')||'en';
let mode='missions', running=false, paused=false, score=0, combo=0, bestCombo=0, lives=3;
let startTime=0,lastTime=0,spawnClock=0,targetId=0,missionIndex=0,missionTimer=0,raf=0,lastSpawn=0;
let targets=new Map(), audioCtx=null;

const missions=[
 {key:'prime',test:n=>isPrime(n)}, {key:'notPrime',test:n=>!isPrime(n)},
 {key:'even',test:n=>n%2===0},{key:'odd',test:n=>n%2!==0},
 {key:'mul3',test:n=>n%3===0},{key:'mul4',test:n=>n%4===0},{key:'mul5',test:n=>n%5===0},
 {key:'square',test:n=>Number.isInteger(Math.sqrt(n))},
 {key:'greater',test:n=>n>50,threshold:50},{key:'less',test:n=>n<50,threshold:50}
];

function isPrime(n){
 if(n<2)return false;
 if(n===2)return true;
 if(n%2===0)return false;
 for(let i=3;i*i<=n;i+=2)if(n%i===0)return false;
 return true;
}
function tr(k){return T[lang][k]||T.en[k]||k}
function show(name){
 Object.values(screens).forEach(s=>s.classList.remove('active'));
 screens[name].classList.add('active');
}
function updateText(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=tr(el.dataset.i18n));
 $('helpText').innerHTML=tr('helpText');
 $('highScore').textContent=localStorage.getItem('nhHigh')||0;
 document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('selected',b.dataset.lang===lang));
 if(!running) $('mission').textContent='🎯';
}
function beep(freq=500,dur=.05){
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.035,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function missionText(){
 if(mode==='quick')return '⚡ '+tr('quickMission');
 if(mode==='survival')return '❤️ '+tr('survivalMission');
 const m=missions[missionIndex], name=tr(m.key);
 return '🎯 '+tr('mission')+' '+name+(m.threshold?' '+m.threshold:'');
}
function setLives(){
 $('lives').textContent=mode==='quick'?'⏱️':('❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives)));
}
function resetGame(){
 score=0;combo=0;bestCombo=0;lives=3;missionIndex=0;missionTimer=0;
 targets.clear();arena.innerHTML='';
 $('score').textContent='0';setLives();$('mission').textContent=missionText();
}
function chooseMode(m){
 mode=m;show('game');resetGame();startCountdown();
}
function startCountdown(){
 const c=$('countdown');c.classList.add('show');
 let n=3;c.textContent=n;
 const timer=setInterval(()=>{
  n--;
  if(n>0){c.textContent=n;beep(450+n*100,.07)}
  else{clearInterval(timer);c.classList.remove('show');beginGame();}
 },650);
}
function beginGame(){
 running=true;paused=false;startTime=performance.now();lastTime=startTime;lastSpawn=0;
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);beep(700,.1);
}
function stopGame(){
 running=false;paused=false;cancelAnimationFrame(raf);targets.clear();arena.innerHTML='';
}
function addScore(v){
 score=Math.max(0,score+v);$('score').textContent=score;
 const high=Number(localStorage.getItem('nhHigh')||0);
 if(score>high)localStorage.setItem('nhHigh',score);
}
function hitTarget(t){
 if(!running||paused||!targets.has(t.id))return;
 targets.delete(t.id);t.el.remove();
 if(t.good){
  combo++;bestCombo=Math.max(bestCombo,combo);
  addScore(10+Math.min(combo,20));
  beep(620+Math.min(combo,10)*25,.055);
 }else{
  combo=0;addScore(-5);beep(170,.12);
  if(mode==='survival'){lives--;setLives();if(lives<=0){endGame();return;}}
 }
}
function spawn(){
 const w=arena.clientWidth,h=arena.clientHeight;
 if(w<100||h<150)return;
 const n=2+Math.floor(Math.random()*98);
 let good;
 if(mode==='quick')good=true;
 else good=missions[missionIndex].test(n);
 const size=58;
 const x=6+Math.random()*Math.max(8,w-size-12);
 const y=-size-5;
 const el=document.createElement('button');
 el.type='button';el.className='target '+(good?'good':'bad');el.textContent=n;
 el.style.left=x+'px';el.style.top=y+'px';
 const id=++targetId;
 el.addEventListener('pointerdown',e=>{e.preventDefault();hitTarget(targets.get(id));},{passive:false});
 arena.appendChild(el);
 targets.set(id,{id,el,y,speed:baseSpeed(),good});
}
function baseSpeed(){
 const elapsed=(performance.now()-startTime)/1000;
 return 55+elapsed*2.1;
}
function spawnPower(){
 if(mode==='missions'&&Math.random()>.18)return;
 const w=arena.clientWidth,h=arena.clientHeight;
 if(w<100||h<150)return;
 const el=document.createElement('button');el.type='button';el.className='power';el.textContent='💣';
 el.style.left=(10+Math.random()*Math.max(10,w-78))+'px';el.style.top='-65px';
 let y=-65, speed=baseSpeed()*.8, alive=true;
 const id='p'+Date.now()+Math.random();
 const obj={id,el,y,speed,power:true};
 targets.set(id,obj);arena.appendChild(el);
 el.addEventListener('pointerdown',e=>{
  e.preventDefault();if(!running||paused||!alive)return;
  alive=false;targets.delete(id);el.remove();beep(300,.12);clearTargets();addScore(20);
 },{passive:false});
}
function clearTargets(){
 targets.forEach(t=>{if(t.el&&t.el.parentNode)t.el.remove()});
 targets.clear();
}
function nextMission(){
 missionIndex=(missionIndex+1)%missions.length;
 missionTimer=0;clearTargets();$('mission').textContent=missionText();beep(760,.08);
}
function loop(now){
 if(!running)return;
 raf=requestAnimationFrame(loop);
 if(paused){lastTime=now;return}
 const dt=Math.min(.035,(now-lastTime)/1000);lastTime=now;
 const elapsed=(now-startTime)/1000;
 const interval=Math.max(330,900-elapsed*5.5);
 spawnClock+=dt*1000;
 if(spawnClock>=interval){spawnClock=0;spawn();if(Math.random()<.08)spawnPower()}
 if(mode==='missions'){
  missionTimer+=dt;
  if(missionTimer>=8)nextMission();
 }
 targets.forEach(t=>{
  if(!t.el||!t.el.parentNode){targets.delete(t.id);return}
  t.y+=t.speed*dt;
  t.el.style.top=t.y+'px';
  if(t.y>arena.clientHeight+70){
   if(t.good&&!t.power){
    combo=0;
    if(mode==='survival'){lives--;setLives();if(lives<=0){endGame();return}}
   }
   targets.delete(t.id);t.el.remove();
  }
 });
}
function pauseToggle(){
 if(!running)return;
 paused=!paused;
 $('pauseBtn').innerHTML=paused?'▶ '+tr('resume'):'⏸ '+tr('pause');
}
function endGame(){
 if(!running)return;
 stopGame();$('finalScore').textContent=score;$('bestCombo').textContent=bestCombo;
 $('resultTitle').textContent=tr('gameover');updateText();show('result');
}
function home(){
 stopGame();$('pauseBtn').innerHTML='⏸ '+tr('pause');updateText();show('home');
}
function playAgain(){show('mode')}
$('playBtn').addEventListener('click',()=>{beep(600,.05);show('mode')});
$('helpBtn').addEventListener('click',()=>{beep(500,.05);show('help')});
$('backHelp').addEventListener('click',()=>show('home'));
$('backMode').addEventListener('click',()=>show('home'));
$('missionMode').addEventListener('click',()=>chooseMode('missions'));
$('quickMode').addEventListener('click',()=>chooseMode('quick'));
$('survivalMode').addEventListener('click',()=>chooseMode('survival'));
$('pauseBtn').addEventListener('click',pauseToggle);
$('bombBtn').addEventListener('click',()=>{if(running&&!paused){clearTargets();addScore(15);beep(280,.1)}});
$('exitBtn').addEventListener('click',()=>{stopGame();show('mode')});
$('againBtn').addEventListener('click',playAgain);
$('homeBtn').addEventListener('click',home);
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>{
 lang=b.dataset.lang;localStorage.setItem('nhLang',lang);updateText();beep(650,.05);
}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pauseToggle()});
window.addEventListener('resize',()=>{if(running)targets.forEach(t=>{const max=Math.max(0,arena.clientWidth-60);t.el.style.left=Math.min(parseFloat(t.el.style.left)||0,max)+'px'})});
updateText();
})();
</script>
</body>
</html>
